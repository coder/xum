[test]
root = "src"
preload = ["./tests/setup.ts"]

[install]
# Resolve only releases at least a week old (in seconds) when bun.lock changes (bun add, bun
# update, a non-frozen install): a compromised release is usually caught and pulled within days
# (#7227). Installs from bun.lock (--frozen-lockfile) are unaffected. To take a newer release on
# purpose (an urgent fix), list the package in minimumReleaseAgeExcludes.
minimumReleaseAge = 604800
# electron: the CVE-2026-111497 fix (#7358). Remove once that release is a week old.
minimumReleaseAgeExcludes = ["electron"]
