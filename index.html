<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Parallel agentic development with Electron + React" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style: black-translucent puts the page under the iOS status bar, where iOS 26+ can blur the app header. -->
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" vite-ignore />
    <link rel="icon" href="favicon.ico" data-theme-icon vite-ignore />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" vite-ignore />
    <title>xum - coding agent multiplexer</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--color-surface-primary, #0a0a0b);
        color: var(--color-foreground, #d4d4d4);
        font-family: var(
          --font-primary,
          -apple-system,
          BlinkMacSystemFont,
          "Geist",
          system-ui,
          "Segoe UI",
          "Roboto",
          "Helvetica Neue",
          Arial,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol"
        );
        font-size: 14px;
      }

      :root[data-theme="light"] body {
        background: #ffffff;
      }

      :root[data-theme="flexoki-light"] body {
        background: #fffcf0;
      }

      #root {
        height: 100vh; /* fallback for older browsers */
        height: var(--app-viewport-height, 100dvh);
        overflow: hidden;
        background: var(--color-surface-primary, #0a0a0b);
      }

      :root[data-theme="light"] #root {
        background: #ffffff;
      }

      :root[data-theme="flexoki-light"] #root {
        background: #fffcf0;
      }

      :root[data-theme="flexoki-dark"] body {
        background: #100f0f;
      }

      :root[data-theme="flexoki-dark"] #root {
        background: #100f0f;
      }

      /* Pre-JS placeholder to avoid a blank screen on cold start. */
      .boot-loader {
        height: 100vh; /* fallback for older browsers */
        height: 100dvh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-loader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .boot-loader__logo {
        width: 200px;
        height: auto;
        color: #ffffff;
      }

      :root[data-theme="light"] .boot-loader__logo,
      :root[data-theme$="-light"] .boot-loader__logo {
        color: #000000;
      }

      .boot-loader__text {
        margin: 0;
        font-size: 14px;
        color: var(--color-text-secondary, #6b6b6b);
      }

      :root[data-theme="light"] .boot-loader__text,
      :root[data-theme$="-light"] .boot-loader__text {
        color: var(--color-text-secondary, #607081);
      }

      /* Boot failure state (see the boot-load-failure script below). The app's stylesheet loads
         with the app, and the app is what failed, so this state paints from this block alone:
         the theme variables name the app's tokens, and the hex or hsl values after them are the
         dark and light values of those tokens for a page that has none. */
      .boot-loader__failure {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        box-sizing: border-box;
        max-width: min(44ch, 100vw);
        padding: 0 24px;
        text-align: center;
      }

      /* The loading text is a quiet hint. This one is what the user has to read, and the dark
         secondary text color is below 4.5:1 on the dark page. The light rules above are higher
         up in specificity and keep their own color, which passes. */
      .boot-loader__failure .boot-loader__text {
        text-wrap: balance;
        color: var(--color-foreground, #d4d4d4);
      }

      .boot-loader__title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--color-foreground, #d4d4d4);
      }

      :root[data-theme="light"] .boot-loader__title,
      :root[data-theme$="-light"] .boot-loader__title {
        color: var(--color-foreground, #212930);
      }

      .boot-loader__button {
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        color: var(--color-accent-foreground, #ffffff);
        background: var(--color-accent, hsl(207 100% 40%));
      }

      :root[data-theme="light"] .boot-loader__button,
      :root[data-theme$="-light"] .boot-loader__button {
        background: var(--color-accent, hsl(207 90% 42%));
      }

      .boot-loader__button:hover {
        background: var(--color-accent-button-hover, hsl(207 100% 37%));
      }

      :root[data-theme="light"] .boot-loader__button:hover,
      :root[data-theme$="-light"] .boot-loader__button:hover {
        background: var(--color-accent-button-hover, hsl(207 90% 38%));
      }

      .boot-loader__button:focus-visible {
        outline: 2px solid var(--color-foreground, #d4d4d4);
        outline-offset: 2px;
      }

      :root[data-theme="light"] .boot-loader__button:focus-visible,
      :root[data-theme$="-light"] .boot-loader__button:focus-visible {
        outline-color: var(--color-foreground, #212930);
      }

      /* Animated "..." after the loading text. Uses ::after so it works in
         both the static HTML boot loader and the React LoadingScreen. */
      @keyframes boot-ellipsis {
        0%, 20%  { content: ""; }
        40%      { content: "."; }
        60%      { content: ".."; }
        80%, 100% { content: "..."; }
      }

      .boot-loader__dots {
        display: inline-block;
        width: 1.5ch;
        text-align: left;
      }

      .boot-loader__dots::after {
        content: "";
        animation: boot-ellipsis 1.2s steps(1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__dots::after {
          content: "...";
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        const THEME_KEY = "uiTheme";
        const VALID_THEME_PREFERENCES = new Set([
          "auto",
          "light",
          "dark",
          "flexoki-light",
          "flexoki-dark",
        ]);

        // This boot script runs before the app bundle, so chromeColors.test.ts enforces parity
        // with CHROME_COLORS.
        const THEME_COLORS = {
          dark: "#09090b",
          light: "#f5f5f5",
          "flexoki-light": "#f2f0e5",
          "flexoki-dark": "#1c1b1a",
        };

        function resolveSystemTheme() {
          if (!window.matchMedia) {
            return "dark";
          }

          return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }

        function getColorScheme(theme) {
          return theme === "light" || theme.endsWith("-light") ? "light" : "dark";
        }

        try {
          const stored = window.localStorage.getItem(THEME_KEY);
          let parsed = null;

          // Tolerate legacy values that were written as raw strings (not JSON).
          if (stored) {
            try {
              parsed = JSON.parse(stored);
            } catch {
              parsed = stored;
            }
          }

          let themePreference = "auto";
          if (typeof parsed === "string") {
            if (VALID_THEME_PREFERENCES.has(parsed)) {
              themePreference = parsed;
            } else if (parsed.endsWith("-light")) {
              themePreference = "light";
            } else if (parsed.endsWith("-dark")) {
              themePreference = "dark";
            }
          }

          const theme = themePreference === "auto" ? resolveSystemTheme() : themePreference;
          const colorScheme = getColorScheme(theme);

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = colorScheme;

          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute(
              "content",
              THEME_COLORS[theme] ?? THEME_COLORS[colorScheme] ?? THEME_COLORS.dark
            );
          }
        } catch (error) {
          console.warn("Failed to apply preferred theme early", error);
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <script id="boot-load-failure-script">
      // Until the app's module graph loads, the boot screen below is all a user sees. When a module
      // of that graph fails to load (a network error, or a 404 for a chunk that a new deploy
      // replaced), the browser runs none of the graph: not React, not the app's components, not
      // its keybinds. So this plain script, which imports nothing, is the only code that can tell
      // the user. It swaps "Loading Xum" for a reload prompt when the browser reports a module that
      // did not load:
      //   - a module script element's error event: the entry or one of its static imports
      //     failed to load. A syntax error or a throw while a module runs is an error event on
      //     the window, not on the element, so a runtime error in the static graph never passes
      //     as a load failure. (The dev server answers a module that Vite cannot transform with
      //     HTTP 500, which the browser reports as a failed load too.)
      //   - Vite's vite:preloadError (production builds): a dynamic import or its preload was
      //     rejected. Vite raises it for every rejection of the import, a module that throws as
      //     it runs included.
      // It never cancels an event, so the browser and the app's handlers still see every error.
      // It does nothing once the app replaced the boot screen: from then on the app's own
      // boundaries show load failures. A slow load raises neither event, so a slow load shows
      // the boot screen as before. The copy and the markup are in the template below.
      (function () {
        function show() {
          const loader = document.getElementById("boot-loader");
          const template = document.getElementById("boot-load-failure");
          const loading = loader && loader.querySelector(".boot-loader__text");
          if (!loader || !template || !loading || loader.hasAttribute("data-load-failed")) {
            return;
          }

          const failure = template.content.cloneNode(true);
          const reload = failure.querySelector("button");
          reload.addEventListener("click", function () {
            location.reload();
          });
          loading.replaceWith(failure);
          loader.setAttribute("data-load-failed", "");
          // The alert below announces the failure, so the loader is no longer a busy status.
          loader.removeAttribute("role");
          loader.removeAttribute("aria-live");
          loader.removeAttribute("aria-busy");
          // Focused, so Enter reloads: a keyboard user needs no other way in.
          reload.focus();
        }

        function report() {
          if (document.getElementById("boot-loader")) {
            show();
          } else {
            // A failure that comes before the page body is parsed.
            document.addEventListener("DOMContentLoaded", show, { once: true });
          }
        }

        // Load errors of scripts and stylesheets do not bubble, so listen while capturing.
        window.addEventListener(
          "error",
          function (event) {
            const target = event.target;
            if (target && target.tagName === "SCRIPT" && target.type === "module") {
              report();
            }
          },
          true
        );
        window.addEventListener("vite:preloadError", report);
      })();
    </script>
  </head>
  <body>
    <!-- Invisible color source for the iOS standalone status bar; see .ios-status-bar-band. -->
    <div class="ios-status-bar-band" aria-hidden="true"></div>
    <div id="root">
      <!-- #6017: the boot screen is the whole page, so it holds the one main landmark. -->
      <main>
        <div id="boot-loader" class="boot-loader" role="status" aria-live="polite" aria-busy="true">
          <div class="boot-loader__inner">
            <svg class="boot-loader__logo" aria-hidden="true" viewBox="0 0 134.7754 62" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Reordered prior Mux outlines keep Xum on the established Geist Sans Bold geometry. -->

              <rect x="108.7754" y="13" width="26" height="35" fill="currentColor" />
            </svg>
            <p class="boot-loader__text">Loading Xum<span class="boot-loader__dots"></span></p>
          </div>
        </div>
      </main>
    </div>
    <template id="boot-load-failure">
      <div class="boot-loader__failure" role="alert">
        <h1 class="boot-loader__title">Xum could not load</h1>
        <p class="boot-loader__text">Part of the app did not download. Reload to try again.</p>
        <button type="button" class="boot-loader__button">Reload</button>
      </div>
    </template>
    <script type="module" src="/src/browser/main.tsx"></script>
  </body>
</html>
