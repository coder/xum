name: Desktop Release Build (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (tag, branch, or SHA)"
        required: true
        type: string
      release_tag:
        description: "Release tag used by scripts/generate-version.sh"
        required: true
        type: string
      version_override:
        description: "Optional package.json version override (e.g., 1.2.4-dev.7)"
        required: false
        type: string
        default: ""

jobs:
  build-macos:
    name: Build and Release macOS
    runs-on: macos-15
    permissions:
      contents: write # Upload release assets
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION_OVERRIDE: ${{ inputs.version_override }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # Required for git describe to find tags
          persist-credentials: false

      # electron-builder unpacks the checked Electron zips (both arches: `make dist-mac` builds x64
      # and arm64) instead of downloading them without retries.
      - uses: ./.github/actions/setup-xum
        with:
          electron-zip: "true"
          electron-zip-targets: darwin-x64 darwin-arm64

      - name: Patch package.json version
        if: inputs.version_override != ''
        shell: bash
        run: |
          # Keep this in a script so nightly/release workflows can share behavior.
          node ./scripts/set-package-version.js "$VERSION_OVERRIDE"

      - name: Build application
        run: bun run build

      - name: Setup code signing
        run: ./scripts/setup-macos-signing.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}

      - name: Package for macOS
        # Retry for transient Apple timestamp-server failures during code signing.
        run: ./scripts/retry.sh 3 30 make dist-mac

      - name: Create legacy mux artifact aliases
        run: ./scripts/create-legacy-mux-artifact-aliases.sh

      - name: Smoke test packaged macOS attach_file runtime
        run: make check-mac-attach-file-runtime

      - name: Upload macOS assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder does not publish in any job of this workflow: it would publish to
          # the tag v<version>, and its uploads skip a release created over 2 hours ago, which
          # breaks reruns. Upload every macOS asset with --clobber so reruns replace them.
          gh release upload "$RELEASE_TAG" \
            release/xum-*.dmg \
            release/xum-*.dmg.blockmap \
            release/xum-*.zip \
            release/xum-*.zip.blockmap \
            release/mux-*.dmg \
            release/mux-*.dmg.blockmap \
            release/mux-*.zip \
            release/mux-*.zip.blockmap \
            release/*-mac.yml \
            --clobber

  build-linux:
    name: Build and Release Linux
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    permissions:
      contents: write # Upload release assets
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION_OVERRIDE: ${{ inputs.version_override }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # Required for git describe to find tags
          persist-credentials: false

      # electron-builder unpacks the checked Electron zip instead of downloading it without retries,
      # and finds the AppImage tool in its cache (fetched with retries and a pinned checksum).
      - uses: ./.github/actions/setup-xum
        with:
          electron-zip: "true"
          electron-zip-targets: linux-x64
          appimage-tool: "true"

      - name: Patch package.json version
        if: inputs.version_override != ''
        shell: bash
        run: |
          # Keep this in a script so nightly/release workflows can share behavior.
          node ./scripts/set-package-version.js "$VERSION_OVERRIDE"

      - name: Build application
        run: bun run build

      # --publish never: the upload step below attaches every asset. electron-builder would
      # publish to the tag v<version>, but nightly tags have no v prefix, and a tag rule
      # stops this workflow's token from creating v* tags.
      - name: Package for Linux
        run: bun x electron-builder --linux --publish never ${ELECTRON_ZIP_DIR:+-c.electronDist="$ELECTRON_ZIP_DIR"}

      - name: Create legacy mux artifact aliases
        run: ./scripts/create-legacy-mux-artifact-aliases.sh

      - name: Upload Linux assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder does not publish (--publish never above): this step uploads every
          # asset, with --clobber so reruns replace them.
          gh release upload "$RELEASE_TAG" \
            release/xum-*.AppImage \
            release/mux-*.AppImage \
            release/*-linux.yml \
            --clobber

  build-linux-arm64:
    name: Build and Release Linux arm64
    # Native arm64 runner required for node-pty and duckdb native modules.
    # Falls back to GitHub's hosted arm64 runner for forks.
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-arm-16' || 'ubuntu-24.04-arm' }}
    # Runs after the x64 job, which uploads the update manifest (latest-linux.yml or
    # nightly-linux.yml). The arm64 job only uploads the AppImage, so it never
    # overwrites that manifest.
    needs: [build-linux]
    permissions:
      contents: write # Upload release assets
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION_OVERRIDE: ${{ inputs.version_override }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # Required for git describe to find tags
          persist-credentials: false

      - uses: ./.github/actions/setup-xum
        with:
          electron-zip: "true"
          electron-zip-targets: linux-arm64
          appimage-tool: "true"

      - name: Patch package.json version
        if: inputs.version_override != ''
        shell: bash
        run: |
          # Keep this in a script so nightly/release workflows can share behavior.
          node ./scripts/set-package-version.js "$VERSION_OVERRIDE"

      - name: Build application
        run: bun run build

      - name: Package for Linux arm64
        run: bun x electron-builder --linux --arm64 --publish never ${ELECTRON_ZIP_DIR:+-c.electronDist="$ELECTRON_ZIP_DIR"}

      - name: Create legacy mux artifact aliases
        run: ./scripts/create-legacy-mux-artifact-aliases.sh

      - name: Upload arm64 AppImage to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload only the AppImage (not latest-linux.yml) to avoid
          # overwriting the auto-update manifest produced by the x64 job.
          gh release upload "$RELEASE_TAG" \
            release/xum-*-arm64-linux.AppImage \
            release/mux-*-arm64-linux.AppImage \
            --clobber

  build-windows:
    name: Build and Release Windows
    # The EV signing service account (coder-ci) only trusts jobs in this
    # environment, which only main and v* tags may use. v* tags are not
    # protected in this repository, so callers must only pass a commit on main
    # (release.yml's preflight resolves the tag and checks this).
    environment: code-signing
    runs-on: windows-latest
    permissions:
      contents: write # Upload release assets
      id-token: write # GCP workload identity for code signing
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION_OVERRIDE: ${{ inputs.version_override }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-xum
        with:
          electron-zip: "true"
          electron-zip-targets: win32-x64

      - name: Add MSYS2 make to PATH
        shell: pwsh
        run: |
          # MSYS2 is pre-installed on Windows runners, just needs to be in PATH
          # Install make via pacman (faster than choco)
          C:\msys64\usr\bin\pacman.exe -S --noconfirm make
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify tools
        shell: bash
        run: |
          make --version
          bun --version
          magick --version | head -1

      - name: Patch package.json version
        if: inputs.version_override != ''
        shell: bash
        run: |
          # Keep this in a script so nightly/release workflows can share behavior.
          node ./scripts/set-package-version.js "$VERSION_OVERRIDE"

      - name: Build application
        run: bun run build

      - name: Setup code signing
        id: signing
        uses: ./.github/actions/setup-windows-signing
        with:
          ev_signing_cert: ${{ secrets.EV_SIGNING_CERT }}
          gcp_workload_id_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # --publish never, as on Linux: the upload step below attaches every asset.
      - name: Package for Windows (.exe)
        # This step runs in PowerShell: pass the zip directory (ELECTRON_ZIP_DIR, from setup-xum) on.
        # The argument is an array: splatting a string passes its characters one by one.
        run: |
          $extra = @()
          if ($env:ELECTRON_ZIP_DIR) { $extra = @("-c.electronDist=$env:ELECTRON_ZIP_DIR") }
          bun x electron-builder --win --publish never @extra
        env:
          # EV signing environment variables (used by custom sign script if configured)
          EV_KEYSTORE: ${{ vars.EV_KEYSTORE }}
          EV_KEY: ${{ vars.EV_KEY }}
          EV_TSA_URL: ${{ vars.EV_TSA_URL }}
          GCLOUD_ACCESS_TOKEN: ${{ steps.signing.outputs.gcloud_access_token }}

      - name: Create legacy mux artifact aliases
        shell: bash
        run: ./scripts/create-legacy-mux-artifact-aliases.sh

      - name: Upload Windows assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder does not publish (--publish never above): this step uploads every
          # asset, with --clobber so reruns replace them.
          gh release upload "$RELEASE_TAG" \
            release/xum-*.exe \
            release/xum-*.exe.blockmap \
            release/mux-*.exe \
            release/mux-*.exe.blockmap \
            release/*.yml \
            --clobber

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  checksums-linux:
    name: Generate Linux checksums
    needs: [build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload release assets
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download and checksum Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "xum-*-x86_64-linux.AppImage" \
            --pattern "xum-*-arm64-linux.AppImage" \
            --pattern "mux-*-x86_64-linux.AppImage" \
            --pattern "mux-*-arm64-linux.AppImage" \
            --dir artifacts

          cd artifacts
          for file in xum-*.AppImage mux-*.AppImage; do
            sha256sum "$file" > "${file}.sha256"
          done

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            ./*.sha256
