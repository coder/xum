name: Perf Profiles

on:
  workflow_dispatch:
    inputs:
      perf_profiles:
        description: 'Optional comma-separated profiles (e.g., "small,large,tool-heavy")'
        required: false
        type: string
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: read

jobs:
  perf-profiles:
    name: Performance Profiles
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - name: Install xvfb
        run: |
          if command -v Xvfb >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "Xvfb is already installed"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 10
      - name: Run perf profiling scenarios
        run: xvfb-run -a make test-e2e-perf
        env:
          ELECTRON_DISABLE_SANDBOX: 1
          MUX_E2E_PERF_PROFILES: ${{ github.event.inputs.perf_profiles || '' }}
          # One xl chat-switch round per transport (~2.7 MB history, crosses the 1 MiB WebSocket send window).
          XUM_E2E_CHAT_SWITCH_XL: 1
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-artifacts-${{ github.run_id }}
          path: |
            artifacts/perf/**
            artifacts/playwright-report/**
            artifacts/playwright-output/**
          if-no-files-found: warn

  # Separate job (#4436): 21 server launches with a 180 s per-launch timeout can take ~63 min
  # when startup regresses, which would blow the Electron job's 30-minute budget; a typical run
  # takes 3-6 min. Jobs without `needs` are independent, so a failure in either job does not
  # cancel the other.
  workspace-scale:
    name: Workspace Scale
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - name: Run workspace-scale benchmark
        # Fail fast on a startup regression (typical 3-6 min) and leave time to upload results.
        timeout-minutes: 20
        run: make perf-workspace-scale
      - name: Upload workspace-scale artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workspace-scale-${{ github.run_id }}
          path: |
            artifacts/perf/workspace-scale/*.json
            artifacts/perf/workspace-scale/*.log
          if-no-files-found: warn
