name: Stories

# The agentic story lane (`make test-stories`): the story tests, the Electron stories and the
# agent-tagged repros, each as a model-driven job in the bug-bash sandbox. pr.yml calls it in the
# merge queue (its `stories` job, Sonnet 5.5), and Required counts its result only when the repo
# variable STORIES_MODE is "block". Unset is warn mode: a failure shows in the queue but blocks no
# merge. pr.yml also calls it on each push to a PR that is not a draft (its `stories-pr` job):
# Haiku on PRs, Sonnet in the queue. Required counts that result only when STORIES_PR_MODE is
# "block".
#
# Triggers: change only this block to pick when it runs. The job below works unchanged under
# pull_request, merge_group (called from pr.yml), schedule and workflow_dispatch.
on:
  # From pr.yml's merge_group run, once for each PR in the merge queue (Sonnet 5.5, $3 a job), and
  # from its pull_request run on each push to a PR that is not a draft (Haiku 5.5, $1 a job). No
  # trigger of its own for either, else each runs it twice. The caller passes the key by name.
  workflow_call:
    inputs:
      # The explorer and judge model of every job (launch.ts reads BUGBASH_MODEL). Unset: Sonnet.
      model:
        type: string
        required: false
      # The cap per job at list price, in $. Unset: 3.
      budget_usd:
        type: string
        required: false
    secrets:
      ANTHROPIC_API_KEY:
        required: true
  # One run a night on main: it keeps main's replay cache warm (GitHub evicts a cache that no
  # run reads for 7 days). A merge-queue run saves under its own queue ref, which no run
  # restores, so this run is the one that every other run restores first.
  schedule:
    - cron: "0 6 * * *"
  # On demand, on any branch: Actions > Stories > Run workflow.
  workflow_dispatch: {}

# One run per PR (or per ref for the other events: a merge-queue entry has its own ref), and a
# new push cancels the old run, so its model calls stop too. A ref starts with refs/, so a PR
# run's group never equals a queue, nightly or dispatched run's group. A fixed prefix, not
# github.workflow: a called workflow sees the caller's name ("PR"), and a group equal to
# pr.yml's would cancel the caller's run or be cancelled with it.
concurrency:
  group: stories-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stories:
    # pr.yml's caller jobs are "Test / Stories" (queue) and "Test / Stories (Haiku)" (PR), so the
    # checks read "Test / Stories / make test-stories" and "Test / Stories (Haiku) / make test-stories".
    name: make test-stories
    # For pull_request (pr.yml's stories-pr, which has the same guard): fork and Dependabot PRs
    # get no Actions secrets.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    # In the merge queue: under the ruleset's 60 minutes for checks, so a hung run fails here
    # before the queue drops the entry. A warm run takes 4-5 minutes, so the one retry (below)
    # fits. A cold run that needs each job's full 30 minutes (launch.ts DEADLINE_MS) does not.
    # The nightly and on-demand runs have no such limit: three jobs of at most 30 minutes after a
    # build of up to about 10 minutes, plus setup and the cache steps, so 110 there.
    timeout-minutes: ${{ github.event_name == 'merge_group' && 50 || 110 }}
    env:
      # The cache key's ref: the PR branch on pull_request, else the ref name (a branch, or
      # gh-readonly-queue/main/pr-<n>-<sha> in the merge queue). In env, not inline in run:.
      CACHE_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      # The replay seed (tests/bugbash/sandbox/cacheSeed.ts): this ref's newest seed, else
      # main's. GitHub scopes each saved cache to the ref that saved it (refs/pull/<n>/merge for
      # a PR run), so a PR or the merge queue never changes what main replays. The launcher
      # checks every entry before it stages the seed into the sandbox.
      - name: Restore the replay seed
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/stories/.e2e-cache-seed
          key: stories-cache-${{ env.CACHE_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stories-cache-${{ env.CACHE_REF }}-
            stories-cache-main-
      # The Electron stories start node_modules/electron/dist/electron, which the sandbox mounts
      # read-only. make test-stories runs this too (a prerequisite); a step of its own shows a
      # failed download apart from the jobs.
      - name: make electron-binary
        run: make electron-binary
      # make test-stories refuses a stale sandbox image key (a PR that changes the Dockerfile):
      # BUGBASH_SANDBOX_BUILD_STALE does not apply to model-driven jobs (launch.ts), so such a PR
      # fails here until main publishes the image and image.json pins it.
      # One more run only when every failed job got a provider 5xx (summary.ts --upstream-fault):
      # the user's rule, so that an overloaded provider does not fail a queue entry. A test
      # failure, a 4xx or a refusal fails at once. Before that run, the first run's outputs move
      # out of the checkout to $RUNNER_TEMP, so the Summary and seed steps read the second run's
      # jobs only (each run adds new timestamped job folders to .e2e), and stage() does not copy
      # them into the second run's sandboxes (it stages untracked, unignored files of the tree).
      - name: make test-stories
        run: |
          set -o pipefail
          make test-stories && exit 0
          bun tests/stories/summary.ts --upstream-fault | tee -a "$GITHUB_STEP_SUMMARY"
          for dir in tests/stories/.e2e tests/bugbash/.e2e; do
            dest="$RUNNER_TEMP/first-try/$dir"
            if [[ -d "$dir" ]]; then mkdir -p "$(dirname "$dest")" && mv "$dir" "$dest"; fi
          done
          make test-stories
        env:
          # Only this step gets the key. The launcher keeps it on the host and gives each job a
          # proxy that caps its spend at list price.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.anthropic.com
          BUGBASH_AI: mock
          # The model of every job. schedule and workflow_dispatch have no inputs: Sonnet 5.5.
          BUGBASH_MODEL: ${{ inputs.model || 'anthropic:claude-sonnet-5-5' }}
          # The cap per job, so one run spends at most three times this, six with the retry. $3
          # unless the caller passes budget_usd ($1 for the PR lane).
          BUGBASH_BUDGET_USD: ${{ inputs.budget_usd || '3' }}
      - name: Summary
        if: always()
        run: bun tests/stories/summary.ts >> "$GITHUB_STEP_SUMMARY"
      # Every run saves its seed, a failed one too: e2e (read-write mode) saves a recording only
      # once a check after it passed, and deletes an entry that replayed into a failure. When no
      # job recorded an entry, the restored seed is saved again as it is. Not in the merge queue:
      # a cache saved under a temporary queue ref is never restored, and it only takes space
      # from the caches that main and the dispatched branches use (Codex review of #7013).
      - name: Build the next replay seed
        if: always() && github.event_name != 'merge_group'
        run: bun tests/stories/summary.ts --next-seed tests/stories/.e2e-cache-seed
      - name: Save the replay seed
        if: always() && github.event_name != 'merge_group'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/stories/.e2e-cache-seed
          key: stories-cache-${{ env.CACHE_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
