name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    # The default three, plus ready_for_review: the PR story lane (stories-pr) skips drafts, so
    # it runs once a draft is marked ready. The other jobs run again on that commit.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional test filter (e.g., "workspace", "tests/file.test.ts", or "-t pattern")'
        required: false
        type: string

concurrency:
  # For PRs: group by PR number so pushes to same PR cancel previous runs
  # For main: use unique SHA so builds never cancel each other (we want all artifacts)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detect what files changed to determine which jobs/tests to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      config: ${{ steps.filter.outputs.config }}
      backend: ${{ steps.filter.outputs.backend }}
      browser: ${{ steps.filter.outputs.browser }}
      nix_deps: ${{ steps.filter.outputs.nix_deps }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e_tests: ${{ steps.filter.outputs.e2e_tests }}
      vscode: ${{ steps.filter.outputs.vscode }}
      # Shared job gates, computed once instead of repeated in every job.
      # tests: code or CI config changed, and this isn't the merge queue's post-merge
      # push to main (the merge_group run already validated that exact commit).
      tests: ${{ (steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true') && (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') }}
      # Depot runner sizes. Depot bills 2x, 4x and 8x the elapsed minutes on 4, 8 and 16 vCPU, so
      # each job takes the smallest size that keeps its time. Measured on 2026-10-23 with dispatch
      # runs 39935678316, 39935681840, 39937158652 and 39937162755: Unit, E2E, the bug-bash
      # sandbox, Storybook, Smoke / Server and the builds ran as fast on 4 vCPU as on 16.
      # Integration ran 1.7x longer on 4 vCPU (jest.config.js caps it at 4 workers, which 8 vCPU
      # fits). On 2 vCPU, E2E and the sandbox ran out of heap and unit test hooks timed out.
      # Static Checks keeps 16: 4 cold ESLint workers need 8 GiB each. Labels go through these
      # outputs, not literals, because actionlint refuses unknown runner labels.
      runner-4: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-4' || 'ubuntu-latest' }}
      runner-8: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-8' || 'ubuntu-latest' }}
      runner-16: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'vscode/**'
            backend:
              - 'src/node/**'
              - 'src/cli/**'
              - 'src/desktop/**'
              - 'src/common/**'
              - 'tests/ipc/**'
              - 'tests/runtime/**'
              # Shared Jest harness (setup.ts, testUtils.ts, __mocks__, fixtures), root-level
              # suites (workerBudget.test.ts), tests/run, and Jest's own config: the
              # integration job below runs Jest only when this filter (or browser) matches.
              - 'tests/*'
              - 'tests/__mocks__/**'
              - 'tests/fixtures/**'
              - 'tests/run/**'
              - 'jest.config.js'
              - 'babel.config.cjs'
              - 'scripts/lib/worker_budget.js'
            browser:
              - 'src/browser/**'
              - 'tests/ui/**'
            config:
              - '.github/**'
              - 'scripts/**'
              - 'packages/mux-compat/**'
              - 'jest.config.js'
              # e2e_tests below lists it too: without it here, `tests` stays false on a
              # Playwright-config-only change and test-e2e never runs.
              - 'playwright.config.ts'
              - 'bunfig.toml'
              - 'babel.config.cjs'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig*.json'
              - 'vite*.ts'
              - 'Makefile'
              - 'electron-builder.yml'
              # Pixel's default matrix and the Storybook config decide which snapshots exist,
              # so the snapshot-budget step (Test / Storybook) must run when they change.
              - 'pixel.jsonc'
              - '.storybook/**'
            # Queue-only jobs (test-e2e, bugbash-sandbox, build-vscode) still run on a PR that
            # changes their own tests or sources. This workflow holds their steps, the Makefile
            # their targets, and bun.lock the playwright-core version that keys the sandbox image.
            e2e_tests:
              - 'tests/e2e/**'
              - 'tests/bugbash/**'
              - 'playwright.config.ts'
              - '.github/workflows/pr.yml'
              - 'Makefile'
              - 'package.json'
              - 'bun.lock'
            vscode:
              - 'vscode/**'
            nix_deps:
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'flake.nix'
              - 'nix/**'
              - 'flake.lock'
            # Server image build setup: the Dockerfile and every input it copies except the app
            # sources, plus this workflow. Smoke / Docker runs on PRs that touch them (#5605), and in the merge
            # queue for every change. App sources (src/**, docs/**, public/**, static/**, the
            # HTML entries) are not here: they matched 272 of 301 PR runs (2026-10-23), so the
            # 16-vCPU image build ran on almost every PR push for 2 failures.
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'patches/**'
              - 'Makefile'
              - 'fmt.mk'
              - 'tsconfig.json'
              - 'tsconfig.main.json'
              - 'scripts/generate-version.sh'
              - 'scripts/generate-builtin-agents.sh'
              - 'scripts/generate-builtin-skills.sh'
              - 'scripts/gen_builtin_skills.ts'
              - 'scripts/gen_workflow_runtime_sources.ts'
              - 'scripts/precompress-static.ts'
              - 'scripts/stamp-service-worker.ts'
              - 'scripts/perf/firstLoadJs.ts'
              - 'scripts/build-row-tree-worker.ts'
              - 'scripts/check-analytics-worker.cjs'
              - 'vite.config.ts'
              - '.github/workflows/pr.yml'

  static-check:
    name: Static Checks
    needs: [changes]
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    runs-on: ${{ needs.changes.outputs.runner-16 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - run: ./scripts/generate-version.sh
      # Release binaries pinned by checksum. A version bump needs new checksums for every asset
      # below. Never copy them from the release page: download each asset yourself, run
      # `sha256sum` on it, and check that the result equals the digest GitHub computed at upload
      # (`gh api repos/<owner>/<repo>/releases/tags/<tag> --jq '.assets[] | .name + " " +
      # .digest'`). hadolint v2.12.0 predates those digests: compare with its .sha256 assets.
      - name: Install shfmt and hadolint
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256_X86_64: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
          SHFMT_SHA256_AARCH64: 5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489
          HADOLINT_VERSION: v2.12.0
          HADOLINT_SHA256_X86_64: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
          HADOLINT_SHA256_AARCH64: 5798551bf19f33951881f15eb238f90aef023f11e7ec7e9f4c37961cb87c5df6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              shfmt_arch=amd64 shfmt_sha256="$SHFMT_SHA256_X86_64"
              hadolint_arch=x86_64 hadolint_sha256="$HADOLINT_SHA256_X86_64"
              ;;
            aarch64 | arm64)
              shfmt_arch=arm64 shfmt_sha256="$SHFMT_SHA256_AARCH64"
              hadolint_arch=arm64 hadolint_sha256="$HADOLINT_SHA256_AARCH64"
              ;;
            *)
              echo "::error::no pinned shfmt or hadolint for $(uname -m); add its assets and checksums"
              exit 1
              ;;
          esac
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 5 --retry-all-errors -o "$bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_${shfmt_arch}"
          curl -fsSL --retry 5 --retry-all-errors -o "$bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-${hadolint_arch}"
          echo "${shfmt_sha256}  $bin/shfmt" | sha256sum -c -
          echo "${hadolint_sha256}  $bin/hadolint" | sha256sum -c -
          chmod +x "$bin/shfmt" "$bin/hadolint"
          "$bin/shfmt" --version
          "$bin/hadolint" --version
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # uv runs the Python tools of pyproject.toml. setup-uv checks its download against the
      # checksums it ships, which cover the uv releases before its own: keep `version` at one of
      # them (setup-uv v10.2.0 knows uv up to 0.12.17).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      # ESLint's result cache hashes the Node version, and setup-xum takes the runner's Node 22.x,
      # so a runner with a newer Node misses every entry (#7191). Key the cache by Node version so
      # each version restores a cache it can use.
      - name: Read Node version
        id: node-version
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Cache lint/format state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier
          key: ${{ runner.os }}-lint-fmt-node-${{ steps.node-version.outputs.version }}-${{ hashFiles('eslint.config.mjs', '.prettierrc', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-fmt-node-${{ steps.node-version.outputs.version }}-${{ hashFiles('eslint.config.mjs', '.prettierrc', '.prettierignore') }}-
      - run: make -j static-check-full
        env:
          MUX_ESLINT_CONCURRENCY: 4
          # ESLint's lint workers inherit this heap limit. A cold type-aware run needs about 4 GiB
          # per worker, above Node's default (#7191): 4 workers x 8 GiB fit the 64 GB runner.
          NODE_OPTIONS: --max-old-space-size=8192

  nix-build:
    name: Nix Build
    needs: [changes]
    if: ${{ needs.changes.outputs.nix_deps == 'true' && (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Keep the expensive nix build off the default static-check path.
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#xum --no-link -L

  lint-actions:
    name: Lint Actions
    needs: [changes]
    if: ${{ (needs.changes.outputs.config == 'true') && (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: make lint-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-unit:
    name: Test / Unit (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    # Bound hung runs while allowing setup, build, coverage, and cleanup to finish.
    timeout-minutes: 20
    runs-on: ${{ needs.changes.outputs.runner-4 }}
    strategy:
      fail-fast: false
      matrix:
        # The single-process suite was the pipeline's critical path; see scripts/test-unit-ci.sh.
        # A manual test_filter runs unsharded.
        shard: ${{ fromJSON(github.event.inputs.test_filter != '' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - run: make build-main
      # workflow_dispatch inputs are only triggerable by repo members, so direct
      # interpolation is acceptable and preserves shell quoting in the filter.
      - if: github.event.inputs.test_filter != ''
        run: bun test --max-concurrency=1 --coverage --coverage-reporter=lcov ${{ github.event.inputs.test_filter }} # zizmor: ignore[template-injection]
      - if: github.event.inputs.test_filter == ''
        run: make test-unit-ci
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
      # The runner's curl is older than 8.7, so the run above covers only web_fetch's
      # single-attempt path. Run the real-curl pinning tests once more with a pinned static
      # curl 8.7+ (curl.se lists stunnel/static-curl), so CI also checks the address
      # fallback and its no-retry cases (#6414). The env var fails the file if that curl is
      # not the one on PATH.
      - name: web_fetch pinning tests with curl 8.7+
        if: matrix.shard == 1 && github.event.inputs.test_filter == ''
        env:
          # A version bump needs new checksums for BOTH assets below (#6492). Never copy them
          # from the release page: download each curl-linux-<arch>-musl-<version>.tar.xz
          # yourself, run `sha256sum` on it, and check that the result equals the digest
          # GitHub computed at upload (`gh api repos/stunnel/static-curl/releases/tags/<version>
          # --jq '.assets[] | select(.name == "<asset>") | .digest'`). The release has no
          # build attestations, so those two must agree before the new values land.
          STATIC_CURL_VERSION: 8.22.0
          STATIC_CURL_SHA256_X86_64: dfb02460ba2abe513087538f12a3cf79b74b64a5ea3787ce8ac0cdb11251f884
          STATIC_CURL_SHA256_AARCH64: cf94cbeaae1b3c1944a4a761ef04478f8f0b23e93a324b5ed009b2082eda11f3
          XUM_WEB_FETCH_REQUIRE_CURL_FALLBACK: "1"
        run: |
          # Pick the asset for this runner's CPU, so a move to arm64 runners keeps the step
          # (#6492). Any other CPU fails here instead of silently testing nothing.
          case "$(uname -m)" in
            x86_64) arch=x86_64 sha256="$STATIC_CURL_SHA256_X86_64" ;;
            aarch64 | arm64) arch=aarch64 sha256="$STATIC_CURL_SHA256_AARCH64" ;;
            *)
              echo "::error::no pinned static curl for $(uname -m); add its asset and checksum"
              exit 1
              ;;
          esac
          dir="$RUNNER_TEMP/static-curl"
          mkdir -p "$dir"
          archive="$dir/curl.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/stunnel/static-curl/releases/download/${STATIC_CURL_VERSION}/curl-linux-${arch}-musl-${STATIC_CURL_VERSION}.tar.xz"
          echo "${sha256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$dir" curl
          PATH="$dir:$PATH"
          curl -q --version
          bun test src/node/services/tools/web_fetch.pinning.test.ts
      # The host trap and the in-memory agent-loop proof run in their own bun process, with
      # the trap loaded before tests/setup.ts (make test-host-proof). The normal suite above
      # never loads the trap. Required needs test-unit, so it covers this step.
      - name: Host proof (own process)
        if: matrix.shard == 1 && github.event.inputs.test_filter == ''
        run: make test-host-proof
      # A shard writes one report per process: coverage/lcov.info for the shared
      # process, plus coverage/isolated/<n>/ and coverage/tooling/ (see
      # scripts/test-unit-ci.sh). Upload them all.
      - name: List coverage reports
        id: lcov
        run: echo "files=$(find coverage -name lcov.info 2>/dev/null | LC_ALL=C sort | paste -sd, -)" >>"$GITHUB_OUTPUT"
      # Quality / CRAP merges every shard's report; keep them only briefly. A
      # failed shard's report is incomplete, so it uploads none and the summary
      # shows partial coverage. Informational: an upload error must not fail
      # this required job.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ success() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          name: crap-lcov-unit-${{ matrix.shard }}
          # ran-without-coverage.txt marks a run that fell back to no coverage
          # (scripts/test-unit-ci.sh); Quality / CRAP then only warns on coverage.
          path: |
            coverage/**/lcov.info
            coverage/**/ran-without-coverage.txt
          if-no-files-found: ignore
          retention-days: 3
      - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.lcov.outputs.files }}
          flags: unit-tests
          fail_ci_if_error: false

  test-integration:
    name: Test / Integration (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    # Healthy runs finish in ~4-5 min, but jest's integration testTimeout is 10 minutes,
    # so a single hung test used to collide with a 10-minute job cap: the runner killed
    # the job ("exceeded the maximum execution time of 10m0s") and destroyed all logs,
    # repeatedly kicking green PRs from the merge queue (e.g. runs 32632804824,
    # 32639270365, 32640298486). 20 minutes lets jest fail the hung test with real
    # diagnostics and still bounds a wedged runner.
    timeout-minutes: 20
    runs-on: ${{ needs.changes.outputs.runner-8 }}
    strategy:
      fail-fast: false
      matrix:
        # jest --shard splits suites across runners; ~7.5 min in one job was on the critical path.
        shard: ${{ fromJSON(github.event.inputs.test_filter != '' && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - run: make build-main
      # workflow_dispatch inputs are only triggerable by repo members, so direct
      # interpolation is acceptable and preserves shell quoting in the filter.
      - name: Run integration tests
        run: | # zizmor: ignore[template-injection]
          set -euo pipefail

          # No --maxWorkers override: jest.config.js sizes the pool via
          # workerBudgetFor("jest") (scripts/lib/worker_budget.js), which accounts for
          # per-fork peak memory (~4.7GiB) and live cgroup usage. The old CLI
          # --maxWorkers=100% took precedence over that budget and forked 16 workers
          # on the 16-core/64GB runner (~75GiB peak), thrashing memory. Under that
          # load, wall clock inflated ~10-20x: suites that normally finish in seconds
          # passed at 100-135s while tests with tight explicit timeouts (30-45s) died,
          # which is what made focus/sendModeDropdown/anthropicCacheStrategy flake in
          # the merge queue.

          # Manual override (workflow_dispatch input)
          if [[ -n "${{ github.event.inputs.test_filter }}" ]]; then
            TEST_INTEGRATION=1 bun x jest --coverage --silent --shard="$SHARD" ${{ github.event.inputs.test_filter }}
            exit 0
          fi

          # Skip if no relevant changes
          if [[ "$BACKEND" != "true" && "$BROWSER" != "true" ]]; then
            echo "No backend or browser changes - skipping integration tests"
            exit 0
          fi

          # Backend changed: run ALL integration tests (includes tests/ui)
          if [[ "$BACKEND" == "true" ]]; then
            echo "Backend changes detected - running all integration tests"
            TEST_INTEGRATION=1 bun x jest --coverage --silent --shard="$SHARD" tests/
          else
            # Browser-only changes: run tests/ui
            echo "Browser changes detected - running tests/ui"
            TEST_INTEGRATION=1 bun x jest --coverage --silent --shard="$SHARD" tests/ui/
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          BROWSER: ${{ needs.changes.outputs.browser }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Quality / CRAP merges every shard's report; keep them only briefly. A
      # failed shard's report is incomplete, so it uploads none and the summary
      # shows partial coverage. Informational: an upload error must not fail
      # this required job.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ success() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          name: crap-lcov-integration-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 3
      - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: integration-tests
          fail_ci_if_error: false

  crap:
    name: Quality / CRAP
    # The repo variable CRAP_MODE picks the mode. Unset or anything but "block"
    # is warn mode: informational, scripts/crap/ci.ts exits 0 and Required
    # ignores this job. With "block", ci.ts exits 1 on remaining violations and
    # Required fails with it; a skipped run (merge_group, push) counts as a pass.
    # A skipped or failed test shard leaves no report: the summary shows partial
    # coverage and coverage-based findings only warn. A tool error never
    # blocks: every step is soft and time-boxed (the step timeouts sum to 18
    # minutes, 7 below the job's, which also covers job setup and post
    # steps), and only the Verdict step fails the job, when the finished
    # report has violations in block mode. 394 runs (2026-10-13/14) took 28s at
    # most, the CRAP report step 9s at most.
    # ROLLBACK: set the CRAP_MODE repo variable back to "warn" (Settings ->
    # Secrets and variables -> Actions -> Variables). No code change.
    needs: [changes, test-unit, test-integration]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    continue-on-error: ${{ vars.CRAP_MODE != 'block' }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read the PR's current labels (CRAP report step).
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        continue-on-error: true
        timeout-minutes: 3
        with:
          persist-credentials: false
      # Compare against the merge commit's first parent: the base GitHub built
      # the merge ref on. pull_request.base.sha can differ (a stacked PR's base
      # branch merges into its own test ref, main moves), and then the report
      # scores other PRs' changes. Read the parent from the raw commit object
      # and fetch only it, so no PR commit enters the history: check.ts then
      # reads no Crap-Debt trailers here, and in CI the crap-debt label is the
      # escape hatch (trailers are for the local hook).
      - name: Fetch the merge base
        id: base
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sha=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          git fetch --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      # Setup failures must not block: without bun the report step skips, and
      # without uv check.ts reports a tool error.
      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          bun-version: 1.4.3
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          version: "0.12.17"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        timeout-minutes: 3
        with:
          pattern: crap-lcov-*
          path: coverage-shards
      # ci.ts writes verdict=violations only for a finished report with
      # violations in block mode. A crash or a timeout here leaves no verdict.
      - name: CRAP report
        id: report
        continue-on-error: true
        timeout-minutes: 6
        env:
          BASE_REF: ${{ steps.base.outputs.sha }}
          LCOV_DIR: coverage-shards
          # Shard counts of the test-unit and test-integration matrices above.
          EXPECTED_UNIT: "6"
          EXPECTED_INTEGRATION: "3"
          # Integration shards skip their tests without backend or browser changes.
          INTEGRATION_RAN: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.browser == 'true' }}
          CRAP_MODE: ${{ vars.CRAP_MODE }}
          # A re-run reuses the original event payload, so read the label live:
          # crap-debt-label.yml re-runs this job when crap-debt is added or
          # removed. If the API call fails, fall back to the payload's labels.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_DEBT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'crap-debt') }}
        run: |
          if ! command -v bun >/dev/null; then
            echo "::warning title=CRAP::bun setup failed, so no CRAP report"
            exit 0
          fi
          CRAP_DEBT_LABEL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'any(.labels[]; .name == "crap-debt")') ||
            CRAP_DEBT_LABEL=$EVENT_DEBT_LABEL
          export CRAP_DEBT_LABEL
          bun scripts/crap/ci.ts
      - name: Verdict
        if: ${{ always() }}
        env:
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          if [[ "$VERDICT" == "violations" ]]; then
            echo "❌ CRAP violations (block mode): see the CRAP report step"
            exit 1
          fi

  dry:
    name: Quality / DRY
    # Near-duplicate functions that the PR makes (scripts/dry/). The repo
    # variable DRY_MODE picks the mode, as CRAP_MODE does for Quality / CRAP.
    # Unset or anything but "block" is warn mode: scripts/dry/ci.ts exits 0 and
    # Required ignores this job. With "block", a duplicate that no
    # `dry-duplicate-ok:` marker accepts fails the Verdict step and Required.
    # A tool error never blocks. It needs no test results, so it starts at once
    # and adds no time to Required.
    # ROLLBACK: set the DRY_MODE repo variable back to "warn". No code change.
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    continue-on-error: ${{ vars.DRY_MODE != 'block' }}
    # Above the step timeouts (15 minutes): a cancelled job fails Required in
    # block mode, so only a finished report may block (Codex review of #7149).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        continue-on-error: true
        timeout-minutes: 3
        with:
          persist-credentials: false
      # The merge commit's first parent, as in Quality / CRAP above.
      - name: Fetch the merge base
        id: base
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sha=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          git fetch --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          bun-version: 1.4.3
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          version: "0.12.17"
          enable-cache: false
      # ci.ts writes verdict=violations only for a finished report with
      # unaccepted duplicates in block mode. A crash or a timeout leaves none.
      - name: DRY report
        id: report
        continue-on-error: true
        timeout-minutes: 6
        env:
          BASE_REF: ${{ steps.base.outputs.sha }}
          DRY_MODE: ${{ vars.DRY_MODE }}
        run: |
          if ! command -v bun >/dev/null; then
            echo "::warning title=DRY::bun setup failed, so no DRY report"
            exit 0
          fi
          bun scripts/dry/ci.ts
      - name: Verdict
        if: ${{ always() }}
        env:
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          if [[ "$VERDICT" == "violations" ]]; then
            echo "❌ New duplicates (block mode): see the DRY report step"
            exit 1
          fi

  mutation:
    name: Quality / Mutation
    # Mutants in the PR's changed functions that the unit tests do not kill
    # (scripts/mutate/). It waits for Test / Unit to reuse its coverage
    # (crap-lcov-unit-*): a site on a line no unit test ran is skipped. ci.ts
    # stops at 300 mutants or 15 minutes. The repo variable MUTATION_MODE picks
    # the mode. Unset or anything but "block" is warn mode: ci.ts exits 0. With
    # "block", a survivor that no `mutation-equivalent:` marker accepts fails
    # the Verdict step, so this check turns red. Required does not list this
    # job in either mode: it starts after Test / Unit, the last job Required
    # waits for, so listing it would add its whole run to every PR.
    # ROLLBACK: set the MUTATION_MODE repo variable back to "warn".
    needs: [changes, test-unit]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.tests == 'true' }}
    continue-on-error: ${{ vars.MUTATION_MODE != 'block' }}
    # Above the step timeouts (34 minutes) so a slow setup still leaves a summary.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        continue-on-error: true
        timeout-minutes: 3
        with:
          persist-credentials: false
      # The merge commit's first parent, as in Quality / CRAP above.
      - name: Fetch the merge base
        id: base
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sha=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          git fetch --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      # The mutants run the unit tests, which need node_modules.
      - uses: ./.github/actions/setup-xum
        continue-on-error: true
        timeout-minutes: 6
        with:
          skip-build-caches: "true"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          version: "0.12.17"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        timeout-minutes: 3
        with:
          pattern: crap-lcov-unit-*
          path: coverage-shards
      # ci.ts writes verdict=violations only for a finished report with
      # unaccepted survivors in block mode.
      - name: Mutation report
        id: report
        continue-on-error: true
        timeout-minutes: 18
        env:
          BASE_REF: ${{ steps.base.outputs.sha }}
          LCOV_DIR: coverage-shards
          # Shard count of the test-unit matrix above.
          EXPECTED_UNIT: "6"
          MUTATION_MODE: ${{ vars.MUTATION_MODE }}
        run: |
          if ! command -v bun >/dev/null; then
            echo "::warning title=Mutation::bun setup failed, so no mutation report"
            exit 0
          fi
          bun scripts/mutate/ci.ts
      - name: Verdict
        if: ${{ always() }}
        env:
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          if [[ "$VERDICT" == "violations" ]]; then
            echo "❌ Surviving mutants (block mode): see the Mutation report step"
            exit 1
          fi

  test-storybook:
    name: Test / Storybook
    needs: [changes]
    if: needs.changes.outputs.tests == 'true' && github.event.inputs.test_filter == ''
    runs-on: ${{ needs.changes.outputs.runner-4 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 10
      - run: make storybook-build
      - run: |
          bun x http-server storybook-static -p 6006 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:6006 >/dev/null; then
              echo "Storybook ready"
              break
            fi
            echo "Waiting for Storybook... ($i/30)"
            sleep 0.5
          done
          # Fail the step if Storybook never became reachable.
          curl -sf http://127.0.0.1:6006 >/dev/null
      # Separate step so a budget overrun is not mixed up with interaction-test failures.
      - run: make storybook-budget
      - run: make test-storybook

  test-e2e:
    # No matrix expression in the name: GitHub then appends the matrix values ("linux, 1/4",
    # "macos") to expanded jobs, and a job skipped before matrix expansion shows plain
    # "Test / E2E" instead of the unexpanded expression (#7340).
    name: Test / E2E
    needs: [changes]
    # Queue only on PR pushes: in 330 sampled PR runs (2026-10-16..23) the jobs moved here (E2E,
    # bug-bash sandbox, Smoke / Server, Build / Linux, Build / VS Code) failed 8 times but were
    # a third of the PR cost. The merge queue still runs them for every merge, and a dispatch of
    # this workflow on a branch runs them before the queue.
    if: >-
      needs.changes.outputs.tests == 'true' && github.event.inputs.test_filter == '' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.e2e_tests == 'true')
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the full suite with one worker (shared display focus/clipboard), which
        # took ~9 min serially; Playwright --shard spreads spec files across runners instead.
        include:
          - { os: linux, shard: 1/4 }
          - { os: linux, shard: 2/4 }
          - { os: linux, shard: 3/4 }
          - { os: linux, shard: 4/4 }
          - { os: macos }
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || needs.changes.outputs.runner-4 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - name: Install xvfb
        if: matrix.os == 'linux'
        run: |
          if command -v Xvfb >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "Xvfb is already installed"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y xvfb
      # Bound browser setup; Playwright downloads can stall after progress reaches 100%.
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 10
      # The bug-bash repros (make test-bugbash-repros) run once, on linux shard 1. Their browser
      # comes from @e2e-dev/web's own playwright-core, not the Playwright version above.
      - name: Install bug-bash repro browser
        if: matrix.shard == '1/4'
        timeout-minutes: 10
        run: node_modules/.bin/e2e-web install chromium
      - name: Run tests
        if: matrix.os == 'linux'
        # Native focus and clipboard are shared by every Electron app on this display.
        run: xvfb-run -a make test-e2e PLAYWRIGHT_ARGS="--workers=1 --shard=$SHARD"
        env:
          ELECTRON_DISABLE_SANDBOX: 1
          SHARD: ${{ matrix.shard }}
          # No provider secrets here, so the repros' app uses the mock AI.
          BUGBASH_REPROS: ${{ matrix.shard == '1/4' && '1' || '0' }}
      # The static workspace view's phone skeleton must match the live page (#5971). On drift, the
      # failure names the element and the command that regenerates the skeleton.
      # It reuses the `make build` of `make test-e2e` above.
      - name: Check the phone chrome skeleton
        if: matrix.os == 'linux' && matrix.shard == '1/4'
        run: make check-phone-chrome
      - name: Run tests
        if: matrix.os == 'macos'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BUGBASH_REPROS: "0"
        run: make test-e2e PLAYWRIGHT_ARGS="tests/e2e/scenarios/windowLifecycle.spec.ts"
      # A failed bug-bash repro writes its trace page, screen (accessibility tree, focus) and
      # failure screenshot under tests/bugbash/.e2e/<phase>/results/<test>/ (e2e 0.20+), next to
      # the report. On the host the app log goes to e2e.config.ts's default, .e2e/logs/app.log.
      # Upload them, so a flaky failure (#5810) leaves evidence.
      - name: Upload bug-bash repro failures
        if: failure() && matrix.shard == '1/4'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bugbash-repro-failures
          path: |
            tests/bugbash/.e2e/repros*/results/*/trace.md
            tests/bugbash/.e2e/repros*/results/**/screen-at-failure.txt
            tests/bugbash/.e2e/repros*/results/**/screenshots/*-failure.png
            tests/bugbash/.e2e/repros*/report.json
            tests/bugbash/.e2e/logs/app.log
          # Every path is under the hidden .e2e folder, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  bugbash-sandbox:
    # The bug-bash sandbox (#5714, #5931): its self-check (isolation, proxy and export refusals,
    # against a fake upstream) and the repros of fixed bugs through its launcher, on the mock app
    # AI. No secrets and no model. The launcher pulls the pinned image by digest without
    # credentials, and exits nonzero on a refusal, a failed check or a container left `unknown`.
    # E2E shard 1 still runs the same repros on the host until this job proves stable.
    name: Test / Bug-bash sandbox
    needs: [changes]
    # Queue only on PR pushes, unless the PR changes tests/bugbash (see test-e2e).
    if: >-
      needs.changes.outputs.tests == 'true' && github.event.inputs.test_filter == '' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.e2e_tests == 'true')
    # 45, not 30: a stale image key adds a local image build of up to 25 minutes (below).
    timeout-minutes: 45
    runs-on: ${{ needs.changes.outputs.runner-4 }}
    # Stale-key local build: only main publishes the image, so a PR that changes its inputs (Dockerfile, build.sh,
    # playwright-core) has a stale image.json. With this opt-in the launcher then builds the image
    # locally with build.sh, for these two jobs only, and prints a warning. Model-driven runs
    # (make bug-bash, make mcp-apps-e2e) ignore it and keep the pinned digest.
    env:
      BUGBASH_SANDBOX_BUILD_STALE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - name: Sandbox self-check
        run: make bug-bash-sandbox-check
      - name: Repros in the sandbox
        run: make test-bugbash-repros-sandbox

  test-windows:
    name: Test / Windows
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
        with:
          skip-build-caches: true
      - name: Generate version.ts
        shell: bash
        run: ./scripts/generate-version.sh
      - name: Generate built-in skills content
        shell: bash
        run: ./scripts/generate-builtin-skills.sh
      - name: Run unit tests (Windows smoke)
        shell: pwsh
        run: |
          bun test src/node/utils/paths.test.ts src/node/utils/findExecutableOnPath.test.ts src/node/utils/gitNoHooksEnv.discovery.test.ts src/node/utils/main/bashPath.test.ts src/node/utils/main/resolveLocalPtyShell.test.ts src/node/runtime/SSH2ConnectionPool.test.ts src/node/services/historyService.statusLock.test.ts
      - name: Verify Report slowness script-path placeholders on Windows paths
        shell: pwsh
        run: bun test src/node/services/perf/perfReportService.test.ts -t "script paths"
      - name: Verify Windows plugin path aliases
        shell: pwsh
        run: bun test src/node/services/agentPlugins/discovery.test.ts -t "coalesces Windows case aliases"
      - name: Verify Windows namespaced filesystem roots
        shell: pwsh
        run: bun test src/node/utils/pathUtils.test.ts -t "refuses Windows namespaced roots"
      - name: Verify legacy workspace lookups on Windows checkout paths
        shell: pwsh
        run: bun test src/node/config.test.ts -t "legacy rows with a Windows checkout path"
      - name: Verify a new workspace's projectName on a Windows project path
        shell: pwsh
        run: bun test src/node/services/workspaceService.planNamespace.test.ts -t "folder name, not its path"
      - name: Run Windows integration smoke tests
        shell: pwsh
        run: |
          if ($env:BACKEND -ne "true") {
            Write-Host "No backend changes - skipping Windows integration smoke tests"
            exit 0
          }

          bun x jest --silent tests/ipc/runtime/backgroundBashDirect.test.ts tests/ipc/runtime/executeBash.test.ts tests/ipc/projects/create.test.ts tests/ipc/agents/planCommands.test.ts
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          TEST_INTEGRATION: "1"

  smoke-server:
    name: Smoke / Server
    needs: [changes]
    # Queue only on PR pushes (see test-e2e).
    if: needs.changes.outputs.tests == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ needs.changes.outputs.runner-4 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - run: bun scripts/generate-npm-shrinkwrap.ts
      - run: make build
      - run: make check-startup-imports-runtime
      - name: Pack npm package
        id: pack
        run: echo "tarball=$(./scripts/pack-npm-package.sh)" >> "$GITHUB_OUTPUT"
      - env:
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
          SERVER_PORT: 3001
          SERVER_HOST: localhost
          STARTUP_TIMEOUT: 30
        run: ./scripts/smoke-test.sh
      - name: Test legacy mux forwarding package
        env:
          CANONICAL_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: ./scripts/smoke-test-mux-compat.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: smoke-server-logs
          path: /tmp/tmp.*/server.log
          if-no-files-found: warn
          retention-days: 7

  smoke-docker:
    name: Smoke / Docker
    needs: [changes]
    # Merge queue, non-queue pushes to main, and PRs that touch server image inputs
    # (changes.docker). Not on every PR, and not on the merge queue's push to main.
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.actor != 'github-merge-queue[bot]') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true')
    runs-on: ${{ needs.changes.outputs.runner-16 }}
    permissions:
      contents: read
      id-token: write # Depot OIDC authentication
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1
      - uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
        with:
          project: 3pmt6zbws4
          context: .
          load: true
          tags: mux-server:test
          # The coder/shux -> coder/xum repo rename broke Depot's OIDC trust
          # policy (matches owner/repo as a string), so `depot build` fails with
          # "permission_denied: Invalid token" and blocks the merge queue. Fall
          # back to plain buildx until the Depot project trust policy is updated
          # for the new repo name; Depot acceleration resumes automatically then.
          buildx-fallback: true
      - name: Test container
        run: |
          docker run -d --name mux-test -p 3000:3000 mux-server:test
          for i in {1..30}; do
            curl -sf http://localhost:3000/health && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          curl -sf http://localhost:3000/version | grep -q '"mode":"server"'
          # The runtime stage copies dist/ files by extension (#5964). Fetch one
          # public/ file, one icon and the font the served page preloads, so a dropped
          # pattern fails here.
          curl -sf http://localhost:3000/manifest.json | grep -q '"icons"'
          curl -sf -o /dev/null http://localhost:3000/icon-192.png
          font=$(curl -sf http://localhost:3000/ | grep -o 'as="font"[^>]*href="\./[^"]*\.woff2"' | sed 's/.*href="\.\///; s/"$//')
          test -n "$font"
          curl -sf -o /dev/null "http://localhost:3000/$font"
          # /health passes without the analytics worker, which starts lazily (#5603).
          # Start the shipped worker bundle and open a DuckDB database through it.
          docker exec -i mux-test node - /app/dist/runtime/analyticsWorker.js < scripts/check-analytics-worker.cjs
      - if: failure()
        run: docker logs mux-test
      - if: always()
        run: docker rm -f mux-test || true

  stories:
    name: Test / Stories
    # The agentic story lane (stories.yml), once for each merge-queue entry, with its defaults:
    # Sonnet 5.5 and $3 a job (stories-pr runs it with Haiku on PR pushes). The repo variable
    # STORIES_MODE picks the mode. Unset or anything but "block" is warn mode: the check shows its
    # result, but Required drops it (the results step). With "block", a failure fails Required.
    # The user's bar for "block": 50 queue runs with less than 5% failures. The lane runs
    # make test-stories once more only on a provider 5xx (stories.yml).
    # ROLLBACK: set the STORIES_MODE repo variable back to "warn" (Settings -> Secrets and
    # variables -> Actions -> Variables). No code change.
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/stories.yml
    permissions:
      contents: read
    # By name, not `secrets: inherit`: the lane gets this one key only.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  stories-pr:
    # The check reads "Test / Stories (Haiku) / make test-stories", apart from the queue's lane.
    name: Test / Stories (Haiku)
    # The same lane on each push to a PR that is not a draft: Haiku on PRs, Sonnet in the queue
    # (the user's pick). $1 a job. It restores this PR's seed, else main's, so most steps replay.
    # The repo variable STORIES_PR_MODE picks the mode, as STORIES_MODE does for the queue lane:
    # anything but "block" is warn mode, and Required drops the result (the results step). The
    # user's bar for "block": warn until 50 PR runs with less than 5% failures.
    # ROLLBACK: set the STORIES_PR_MODE repo variable back to "warn" (Settings -> Secrets and
    # variables -> Actions -> Variables). No code change. To stop the lane, delete this job.
    needs: [changes]
    # The guard is here, not only in stories.yml: the call passes a required secret, which fork
    # and Dependabot PRs do not get, so the call itself would fail.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      needs.changes.outputs.tests == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/stories.yml
    permissions:
      contents: read
    # By name, not `secrets: inherit`: the lane gets this one key only.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      model: anthropic:claude-haiku-5-5
      # Haiku missed layout defects on screenshots (caught 21 of 25 on a bug build, Sonnet 25 of
      # 25), so Sonnet judges the story asserts. Haiku still drives the steps.
      judge_model: anthropic:claude-sonnet-5-5
      budget_usd: "1"

  stories-pr-comment:
    name: Test / Stories (Haiku) comment
    # The PR lane's results as one comment on the PR, which each push edits: the user's picks
    # (each PR where the Haiku lane runs, one comment with a section per sandbox job). The job
    # summary shows the same page (stories.yml's Summary step). The lane's sandbox has no
    # network and no token, so this job posts it after the lane, from the reports it uploaded.
    # The write token never meets PR code from the checkout (the user's rule): the job checks out
    # the PR's base commit, installs with no lifecycle scripts, and reads the reports only as
    # data, which the renderer escapes. The job's own steps come from the PR's pr.yml, as for
    # every pull_request job: the guard below admits only branches of this repo, whose authors
    # can push here already, so the token gives them nothing new. Forks get no job (Codex review
    # of #7140; a workflow_run design would also cover a pr.yml edit).
    # Not in Required: a comment that fails to post never blocks a merge.
    needs: [changes, stories-pr]
    # stories-pr's guard, so a PR without a lane run gets no comment. !cancelled(): a failed lane
    # gets its comment too.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      needs.changes.outputs.tests == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # Until this file is on the base branch (this PR, and a PR based on an older commit),
      # there is nothing to run.
      - name: Check the base commit
        id: base
        run: |
          if [[ -f tests/stories/prComment.ts ]]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=Stories comment::The base commit has no tests/stories/prComment.ts, so no comment."
          fi
      - if: steps.base.outputs.ready == 'true'
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.4.3
      # Not setup-xum: its cache could hold a node_modules that a PR run built, and its install
      # runs lifecycle scripts. prComment.ts needs only e2e, installed from the base's lockfile.
      - name: Install with no lifecycle scripts
        if: steps.base.outputs.ready == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      # The collect step always writes a marker file, so the artifact exists whenever the lane got
      # that far. A failed download (no artifact, or a service error) posts nothing, so it never
      # replaces a useful comment with a false "no job left output" (Codex review of #7140).
      - id: download
        if: steps.base.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          # The lane job's own artifact name: a rerun of only this job has a new run_attempt,
          # but the lane's upload keeps the attempt it ran in (Codex review of #7140).
          name: ${{ needs.stories-pr.outputs.reports_artifact }}
          path: ${{ runner.temp }}/stories-reports
      - name: Post the comment
        if: steps.base.outputs.ready == 'true' && steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # prComment.ts writes only while this is still the PR head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The merge commit the lane checked out and tested: the source links point there.
          SOURCE_SHA: ${{ github.sha }}
          BUGBASH_MODEL: ${{ needs.stories-pr.outputs.model }}
          # The retry note names the artifact the lane uploaded (a comment-only rerun has a newer attempt).
          REPORTS_ARTIFACT: ${{ needs.stories-pr.outputs.reports_artifact }}
        run: bun tests/stories/prComment.ts "$RUNNER_TEMP/stories-reports"

  build-linux:
    name: Build / Linux
    needs: [changes]
    # Queue only on PR pushes (see test-e2e).
    if: needs.changes.outputs.tests == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ needs.changes.outputs.runner-4 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - run: bun run build
      - run: make dist-linux
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: release/*.AppImage
          retention-days: 30
          if-no-files-found: error
          archive: false

  build-macos:
    # One runner per arch: both arches packaging in parallel on one 3-core runner was a
    # ~11 min critical-path job.
    name: Build / macOS (${{ matrix.arch }})
    needs: [changes]
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ARCH: ${{ matrix.arch }}
      # PRs only need the DMG they upload; merge-queue and main runs keep the full target list.
      MAC_TARGETS: ${{ github.event_name == 'pull_request' && 'dmg' || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - name: Setup code signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/setup-macos-signing.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}
      - name: Build macOS distributable
        # Retry for transient Apple timestamp-server failures during code signing.
        run: ./scripts/retry.sh 3 30 make "dist-mac-$ARCH"
      - name: Smoke test packaged macOS attach_file runtime
        run: make check-mac-attach-file-runtime MAC_ARCH="$ARCH"
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: release/*-${{ matrix.arch }}-mac.dmg
          retention-days: 30
          if-no-files-found: error
          archive: false

  build-windows:
    name: Build / Windows
    needs: [changes]
    # Windows builds are slow - only run in merge queue and main pushes, not on every PR push
    if: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true') }}
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # GCP workload identity for Windows code signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - name: Add MSYS2 make to PATH
        shell: pwsh
        run: |
          # MSYS2 is pre-installed on Windows runners, just needs to be in PATH
          # Install make via pacman (faster than choco)
          C:\msys64\usr\bin\pacman.exe -S --noconfirm make
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify tools
        shell: bash
        run: |
          make --version
          bun --version
          magick --version | head -1
      - run: bun run build
      - name: Setup code signing
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/setup-windows-signing
        with:
          ev_signing_cert: ${{ secrets.EV_SIGNING_CERT }}
          gcp_workload_id_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Package for Windows
        run: make dist-win
        env:
          # EV signing environment variables (used by custom sign script if configured)
          EV_KEYSTORE: ${{ vars.EV_KEYSTORE }}
          EV_KEY: ${{ vars.EV_KEY }}
          EV_TSA_URL: ${{ vars.EV_TSA_URL }}
          GCLOUD_ACCESS_TOKEN: ${{ steps.signing.outputs.gcloud_access_token }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-windows
          path: release/*.exe
          retention-days: 30
          if-no-files-found: error

  build-vscode:
    name: Build / VS Code
    needs: [changes]
    # Queue only on PR pushes, unless the PR changes vscode/ (see test-e2e).
    if: >-
      needs.changes.outputs.tests == 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.vscode == 'true')
    runs-on: ${{ needs.changes.outputs.runner-4 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xum
      - uses: ./.github/actions/build-vscode-extension
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: vscode/mux-*.vsix
          retention-days: 30
          if-no-files-found: error
          archive: false

  codex-comments:
    name: Codex Comments
    needs: [changes]
    if: github.event_name == 'pull_request'
    # A waiter (it polls Codex for up to 900 s) needs no CPU, and GitHub-hosted standard runners
    # are free for this public repo, so it does not take a Depot runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test PR readiness gates
        run: make test-codex-comments test-pr-checks test-required-superseded
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Codex starts reviewing the same push that started this job, so give it
        # time to finish. Reviews take a few minutes; the slowest test jobs take longer.
        # Usage-limit notices pass; actionable findings still fail the gate.
        run: ./scripts/check_codex_comments.sh ${{ github.event.pull_request.number }} --wait-for-review 900

  # Single required check - configure branch protection to require only this job
  required:
    name: Required
    if: ${{ always() && (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') }}
    needs:
      - changes
      - static-check
      - nix-build
      - lint-actions
      - test-unit
      - test-integration
      - test-storybook
      - test-windows
      - test-e2e
      - bugbash-sandbox
      - smoke-server
      - smoke-docker
      - build-linux
      - build-macos
      - build-windows
      - build-vscode
      - codex-comments
      # Counts only in CRAP block mode (vars.CRAP_MODE == 'block'); see the crap job.
      - crap
      # Counts only in DRY block mode (vars.DRY_MODE == 'block'); see the dry job.
      - dry
      # Counts only in stories block mode (vars.STORIES_MODE == 'block'); see the stories job.
      - stories
      # Counts only in PR stories block mode (vars.STORIES_PR_MODE == 'block'); see stories-pr.
      - stories-pr
    runs-on: ubuntu-latest
    # superseded: read this workflow's runs/jobs and check out the decision script.
    permissions:
      actions: read
      contents: read
    steps:
      # The job results Required judges. In CRAP warn mode (vars.CRAP_MODE is
      # not "block") Quality / CRAP never decides Required, so its result is
      # dropped here, and every later step reads this list. The same for
      # Test / Stories in stories warn mode (vars.STORIES_MODE is not "block"),
      # and for Test / Stories (Haiku) in PR stories warn mode
      # (vars.STORIES_PR_MODE is not "block"), and for Quality / DRY in DRY
      # warn mode (vars.DRY_MODE is not "block").
      - id: results
        env:
          CRAP_MODE: ${{ vars.CRAP_MODE }}
          DRY_MODE: ${{ vars.DRY_MODE }}
          STORIES_MODE: ${{ vars.STORIES_MODE }}
          STORIES_PR_MODE: ${{ vars.STORIES_PR_MODE }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # shellcheck disable=SC2016 # $mode, $dry, $stories and $storiesPr are jq variables, not shell ones.
          filter='to_entries[] | select(.key != "crap" or $mode == "block") | select(.key != "dry" or $dry == "block") | select(.key != "stories" or $stories == "block") | select(.key != "stories-pr" or $storiesPr == "block") | .value.result'
          echo "list=$(jq -r --arg mode "$CRAP_MODE" --arg dry "$DRY_MODE" --arg stories "$STORIES_MODE" --arg storiesPr "$STORIES_PR_MODE" "$filter" <<<"$NEEDS_JSON" | paste -sd ' ' -)" >>"$GITHUB_OUTPUT"
      # A cancelled duplicate run must not leave a red Required when another run for
      # this PR will publish one (#4547). The script stands down only with proof and
      # fails closed otherwise; see its header for the rules.
      - if: >-
          github.event_name == 'pull_request' &&
          contains(steps.results.outputs.list, 'cancelled') &&
          !contains(steps.results.outputs.list, 'failure')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/lib/required_superseded.sh
          sparse-checkout-cone-mode: false
      - id: superseded
        if: >-
          github.event_name == 'pull_request' &&
          contains(steps.results.outputs.list, 'cancelled') &&
          !contains(steps.results.outputs.list, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ./scripts/lib/required_superseded.sh; then
            echo "value=true" >>"$GITHUB_OUTPUT"
          fi
      - env:
          RESULTS: ${{ steps.results.outputs.list }}
          SUPERSEDED: ${{ steps.superseded.outputs.value }}
        run: |
          echo "Job results: $RESULTS"
          if [[ "$SUPERSEDED" == "true" ]]; then
            echo "⏭️ Superseded; a newer run for this commit reports Required"
            exit 0
          fi
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ CI failed"
              exit 1
            fi
          done
          echo "✅ All checks passed"
