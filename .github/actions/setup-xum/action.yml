name: "Setup Xum"
description: "Setup Bun and install dependencies with caching"
inputs:
  skip-build-caches:
    description: "Skip Electron and electron-builder caches (for test-only jobs)"
    required: false
    default: "false"
  electron-zip:
    description: "Cache the Electron zip that jobs launching Electron download, and fetch it with retries on a cache miss"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # Pin Node 22 (LTS) before anything installs deps. The GitHub runners now default
    # to Node 24, whose extract-zip regression (nodejs/node#63487) hangs/corrupts zip
    # extraction in dependency postinstalls — it breaks Electron's `node install.js`
    # ("Electron failed to install correctly") and Playwright's browser install (stalls
    # at 100%), which intermittently fails Test / E2E (macos) on a browser-cache miss.
    # Node 22 is unaffected (microsoft/playwright#41092 workaround). Runs first so its
    # `node` is on PATH for every subsequent `bun install` / `bun x` step.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Setup Bun
      uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
      with:
        bun-version: 1.4.3

    - name: Get Bun version
      id: bun-version
      shell: bash
      run: echo "version=$(bun --version)" >> $GITHUB_OUTPUT

    # Capture the Node version to key the node_modules cache below. Without it, changing
    # the pinned Node (e.g. from the runner default to the version pinned above) would hit
    # a cache built under the old Node and skip `bun install`, keeping modules whose
    # postinstalls (Electron) ran — and whose native ABI was built — under the wrong Node,
    # which defeats this pin. (Codex review, PR #3656.)
    - name: Get Node version
      id: node-version
      shell: bash
      run: echo "version=$(node --version)" >> $GITHUB_OUTPUT

    # Every key below hashes the three tracked lockfiles by literal path, never '**/bun.lock'.
    # A glob walks the whole checkout, and after the node_modules restore that is ~100k files:
    # 8-9 s per key on macOS, and the walk once failed the job with "Fail to hash files under
    # directory" (#6979). Literal paths are only stat'ed. hashFiles hashes files in pattern
    # order, and this order matches the glob's (alphabetical), so the keys stay the same.
    # Add new lockfiles here.
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun-version.outputs.version }}-node-${{ steps.node-version.outputs.version }}-node-modules-${{ hashFiles('bun.lock', 'packages/chat-components/bun.lock', 'vscode/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun-version.outputs.version }}-node-${{ steps.node-version.outputs.version }}-node-modules-

    - name: Check if node_modules exists
      id: check-node-modules
      shell: bash
      run: |
        if [ -d "node_modules" ] && [ -d "node_modules/.bin" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    # Only restore bun install cache when node_modules is completely missing.
    # This avoids 88+ seconds of tar/zstd decompression on Windows for partial cache hits.
    - name: Cache bun install cache
      if: steps.check-node-modules.outputs.exists != 'true'
      id: cache-bun-install
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock', 'packages/chat-components/bun.lock', 'vscode/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-cache-

    # Always run install if we didn't get an exact cache hit.
    # This handles restore-key matches which may have stale/incomplete node_modules.
    # Delete node_modules first to ensure a clean install - bun install --frozen-lockfile
    # only verifies packages are present, it doesn't update stale packages from a restore-key match.
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -rf node_modules
        bun install --frozen-lockfile

    # Cache Electron binaries and electron-builder resources (NSIS, etc.)
    # These are downloaded during electron-builder and can be 200MB+ total.
    # Skip for test-only jobs to save ~30s on Windows (260MB + 11MB cache restore).
    - name: Cache Electron
      if: ${{ inputs.skip-build-caches != 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock', 'packages/chat-components/bun.lock', 'vscode/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-electron-

    - name: Cache electron-builder
      if: ${{ inputs.skip-build-caches != 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/electron-builder
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron-builder/Cache
        key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock', 'packages/chat-components/bun.lock', 'vscode/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-electron-builder-

    # The zip that node_modules/electron/install.js downloads from github.com on the first
    # launch (bun skips Electron's postinstall, so nothing downloads it earlier). The caches
    # above never served E2E and Stories: they key on the lockfiles alone, and whichever job
    # misses a new key first saves it. Linux's entry held only the stale zips that its
    # restore-keys prefix had restored (44.5.1 and 40.9.3). macOS's held the zip flat in the
    # cache root, where @electron/get does not look. So every E2E and Stories job downloaded
    # the zip, and a 504 from github.com failed those jobs on 2026-11-08.
    # This cache has one purpose: the current zip, in a directory of its own that
    # electron_config_cache points @electron/get at. The key hashes checksums.json, so a new
    # Electron version or checksum starts a fresh cache, and there is no restore-keys fallback
    # to bring old zips back. The key does not start with `<os>-<arch>-electron-`, the
    # restore-keys prefix of the two Electron caches above, so their prefix lookups cannot
    # return it (scripts/ci/cachePaths.test.ts). @electron/get checks the zip against
    # checksums.json on every use, so a restored entry never supplies unpinned bytes. On a
    # miss the zip is downloaded here, retrying for 15 minutes, and saved at once.
    - name: Point Electron downloads at their own cache
      if: ${{ inputs.electron-zip == 'true' }}
      shell: bash
      run: echo "electron_config_cache=$HOME/.cache/xum-electron-zip" >> "$GITHUB_ENV"

    - name: Restore Electron zip
      if: ${{ inputs.electron-zip == 'true' }}
      id: cache-electron-zip
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.electron_config_cache }}
        key: xum-electron-zip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/electron/checksums.json') }}

    # The 15 minute budget fits both callers: E2E has no job time limit, and a Stories run
    # (4 to 5 minutes warm) stops at 50 minutes in the merge queue.
    - name: Download Electron zip
      if: ${{ inputs.electron-zip == 'true' && steps.cache-electron-zip.outputs.cache-hit != 'true' }}
      shell: bash
      run: ./scripts/retry.sh --budget-secs 900 --max-backoff-secs 60 --fatal-status 64 0 2 node scripts/ci/prefetch-electron-zip.cjs

    # Saved at once: a later failing step in the job must not discard a zip that took minutes.
    - name: Save Electron zip
      if: ${{ inputs.electron-zip == 'true' && steps.cache-electron-zip.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.electron_config_cache }}
        key: ${{ steps.cache-electron-zip.outputs.cache-primary-key }}
