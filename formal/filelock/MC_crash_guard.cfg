\* Faithful: dead owner's lock, crash at any step + pid reuse, 2 slots. A reclaimer crashing inside the guard leaves the stale guard of MC_stale_guard.
SPECIFICATION Spec
CONSTANTS
  Slots = {1, 2}
  MaxTok = 11
  MaxInc = 2
  Depth = 2
  Linux = TRUE
  CanCrash = TRUE
  InitStaleLock = TRUE
  InitStaleGuard = FALSE
  ReleaseFault = 0
  OldLease = {}
  NoReread = FALSE
INVARIANTS TypeOK MutualExclusion CommitExclusion NoReclaimFromLiveHolder ReleaseOwnOnly GuardExclusion StaleGuardReclaimSafe NoOrphanLock NoOrphanGuard
