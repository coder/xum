\* Faithful: empty start, crash at any step, pid reuse (restart), 2 slots. Small token bound: expect all to hold.
SPECIFICATION Spec
CONSTANTS
  Slots = {1, 2}
  MaxTok = 9
  MaxInc = 2
  Depth = 2
  Linux = TRUE
  CanCrash = TRUE
  InitStaleLock = FALSE
  InitStaleGuard = FALSE
  ReleaseFault = 0
  OldLease = {}
  NoReread = FALSE
INVARIANTS TypeOK MutualExclusion CommitExclusion NoReclaimFromLiveHolder ReleaseOwnOnly GuardExclusion StaleGuardReclaimSafe NoOrphanLock NoOrphanGuard
