\* G4 pre-fix (abandoned work): a queued automatic turn refused or withdrawn after the turn before
\* it ended leaves an active goal with nothing to drive it.
SPECIFICATION Spec
CONSTANTS
  MaxGoals = 1
  Cap = 0
  MaxTurns = 3
  MaxUser = 0
  MaxHbGen = 1
  MaxRestarts = 0
  HbMode = "queue"
  UserActs = FALSE
  ExceptionActs = FALSE
  ModelComplete = FALSE
  Errors = FALSE
  ArchiveOn = FALSE
  FixStaleDrop = TRUE
  FixHbQueueRecheck = TRUE
  FixHbSendRecheck = TRUE
  MutNoProbe = FALSE
  FixErrorResume = TRUE
  MaxErrResume = 1
  AbandonActs = TRUE
  FixAbandonAdvance = FALSE
INVARIANTS TypeOK NoStrandedGoal NoStaleContinuation NoHeartbeatWhenOff NoDoubleFire UsedBounded NoTurnWhenArchived
