\* G4 fixed: a terminal stream error resumes an active goal, bounded by MaxErrResume; MaxTurns
\* exceeds the resume allowance so an exhausted episode is reachable. Covers the exceptions:
\* user and model pause/complete, user Stop, auto-retry opt-out, the turn cap, and a restart.
SPECIFICATION Spec
CONSTANTS
  MaxGoals = 1
  Cap = 2
  MaxTurns = 4
  MaxUser = 2
  MaxHbGen = 0
  MaxRestarts = 1
  HbMode = "off"
  UserActs = TRUE
  ExceptionActs = TRUE
  ModelComplete = TRUE
  Errors = TRUE
  ArchiveOn = FALSE
  FixStaleDrop = TRUE
  FixHbQueueRecheck = TRUE
  FixHbSendRecheck = TRUE
  MutNoProbe = FALSE
  FixErrorResume = TRUE
  MaxErrResume = 2
  AbandonActs = FALSE
  FixAbandonAdvance = TRUE
INVARIANTS TypeOK NoStrandedGoal NoStaleContinuation NoHeartbeatWhenOff NoDoubleFire UsedBounded NoTurnWhenArchived
