\* Two backends, a lease owner stalls once (no crash), the code with the W8 tombstone and the W7
\* pending-run recovery (whose starter check keeps it off a run the other backend is starting).
\* Without a crash W10 cannot occur, so its fix flag being off makes this exactly that code.
SPECIFICATION Spec
CONSTANTS
  TwoBackends = TRUE
  NSteps = 2
  MaxChildren = 4
  MaxCrashes = 0
  MaxInterrupts = 1
  MaxDeadlines = 0
  MaxStalls = 1
  UserResumesPending = FALSE
  FixRecoverPending = TRUE
  NoRecordMode = "tomb"
  FixPrepassReceipt = FALSE
  MutNoLeaseFence = FALSE
INVARIANTS TypeOK SingleLiveChild NoReexec CompletedSound ResultSound IdsSuffice
PROPERTIES Terminates
