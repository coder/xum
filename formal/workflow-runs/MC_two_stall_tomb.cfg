\* Two backends, a lease owner stalls once (no crash), the code with the W8 tombstone. Without a
\* crash W7 and W10 cannot occur, so their fix flags being off makes this exactly that code.
SPECIFICATION Spec
CONSTANTS
  TwoBackends = TRUE
  NSteps = 2
  MaxChildren = 4
  MaxCrashes = 0
  MaxInterrupts = 1
  MaxDeadlines = 0
  MaxStalls = 1
  UserResumesPending = FALSE
  FixRecoverPending = FALSE
  NoRecordMode = "tomb"
  FixPrepassReceipt = FALSE
  MutNoLeaseFence = FALSE
INVARIANTS TypeOK SingleLiveChild NoReexec CompletedSound ResultSound IdsSuffice
PROPERTIES Terminates
