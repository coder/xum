\* Two backends, one crash and one interrupt (no stall), all fix flags on. W10b (open): p2
\* interrupts while p1 owns the live child, and p1 dies before the child ends.
SPECIFICATION Spec
CONSTANTS
  TwoBackends = TRUE
  NSteps = 2
  MaxChildren = 4
  MaxCrashes = 1
  MaxInterrupts = 1
  MaxDeadlines = 0
  MaxStalls = 0
  UserResumesPending = FALSE
  FixRecoverPending = TRUE
  NoRecordMode = "tomb"
  FixPrepassReceipt = FALSE
  FixInterruptOrder = TRUE
  MutNoLeaseFence = FALSE
  MutNoInterruptHold = FALSE
INVARIANTS TypeOK SingleLiveChild NoReexec CompletedSound ResultSound IdsSuffice
PROPERTIES Terminates
