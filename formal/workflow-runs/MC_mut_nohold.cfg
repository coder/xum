\* Mutant: MC_fixed without the lease hold; a crash-recovery runner starts while the
\* interrupted run's children are being terminated.
SPECIFICATION Spec
CONSTANTS
  TwoBackends = FALSE
  NSteps = 2
  MaxChildren = 4
  MaxCrashes = 1
  MaxInterrupts = 1
  MaxDeadlines = 0
  MaxStalls = 0
  UserResumesPending = FALSE
  FixRecoverPending = TRUE
  NoRecordMode = "tomb"
  FixPrepassReceipt = FALSE
  FixInterruptOrder = TRUE
  MutNoLeaseFence = FALSE
  MutNoInterruptHold = TRUE
INVARIANTS TypeOK SingleLiveChild NoReexec CompletedSound ResultSound IdsSuffice
PROPERTIES Terminates
