  Ops = {1}
  UserBranches = {}
  Faults = {"metaRead"}
  Consent = "after-setup"
  RemoveOp = FALSE
  MaxRemoveTries = 2
  Peer = TRUE
  Mutant = "none"
  Fixes = {}
INVARIANTS TypeOK NoOrphanCheckout UserBranchSafe FailedNoGrant Finalized UniqueNames NoReappear
