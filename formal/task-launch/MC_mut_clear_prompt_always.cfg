\* Mutant: a failed launch always drops the prompt. Expect PromptRetainedUntilAccepted violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = TRUE
  AllowRemove = FALSE
  AllowReact = TRUE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = FALSE
  Fixes = {"initRecheck", "reactSkipsAccepted"}
  Mutant = "clearPromptAlways"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
