  AllowCancel = TRUE
  AllowStop = FALSE
  AllowRemove = FALSE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck"}
