\* remove with the recheck before the init (pendingRemoval too) and a missing or removal-marked row treated as the removal's. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = TRUE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
