\* Mutant: cleanup deletes unless the row names its own attempt. Expect CleanupNeverTouchesSuccessor violated (plus the U3 OneMaterializer and PromptSentOnce).
SPECIFICATION Spec
CONSTANTS
  AllowCancel = TRUE
  AllowStop = FALSE
  AllowRemove = FALSE
  AllowReact = FALSE
  SecondBackend = TRUE
  MaxRestarts = 0
  ForkCanFail = FALSE
  Fixes = {"initRecheck"}
  Mutant = "cleanupNoOwnerCheck"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
