\* Mutant: the launch takes its lease at its entry, after the row became `starting`. A second backend's startup recovery scans the leases before that, then requeues the row and relaunches it mid-launch: both launches prepare one checkout, a failed fork removes the path the other reused, and both can send the initial prompt. Expect OneMaterializer, CleanupNeverTouchesSuccessor and PromptSentOnce violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = FALSE
  AllowReact = FALSE
  SecondBackend = TRUE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes", "prepLease"}
  Mutant = "lateLease"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
