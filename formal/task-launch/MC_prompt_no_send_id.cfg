\* U4 before the brief's send id: the kept taskPrompt is prepended again on reawakening. Expect PromptSentOnce violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = TRUE
  AllowRemove = FALSE
  AllowReact = TRUE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = FALSE
  Fixes = {"initRecheck", "missingRowDeletes", "prepLease"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
