\* U4 (shipped code): a Stop lands after the launch send accepted the prompt (before `running`, or failing the send after its rows became durable). The reawakening prepends the kept taskPrompt only while no history row carries the brief's send id. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = TRUE
  AllowRemove = FALSE
  AllowReact = TRUE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = FALSE
  Fixes = {"initRecheck", "reactSkipsAccepted"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
