\* U4: a Stop lands after the launch send accepted the prompt (before `running`, or failing the send after its rows became durable); the kept taskPrompt is prepended again on reawakening. Expect PromptSentOnce violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = TRUE
  AllowRemove = FALSE
  AllowReact = TRUE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = FALSE
  Fixes = {"initRecheck"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
