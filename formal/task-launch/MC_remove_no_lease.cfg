\* U2 before the launch lease (#5528: the cleanup deletes for a missing row only). A row a removal only marked keeps the checkout the fork recreated. Expect RemovedRowLeavesNoCheckout violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = TRUE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
