\* U3 before the launch lease: a second backend's startup requeues the preparing row and re-admits it: both launches prepare one checkout, a failed fork removes the path the other reused, and both can send the initial prompt. Expect OneMaterializer, CleanupNeverTouchesSuccessor and PromptSentOnce violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = FALSE
  AllowReact = FALSE
  SecondBackend = TRUE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
