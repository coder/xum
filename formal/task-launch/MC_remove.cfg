\* U2 (shipped code): a removal while the launch prepares. The launch lease makes them exclude each other: the removal's gate refuses a live launch lease, the launch refuses a live gate, and the fork gate refuses a marked row; the cleanup deletes for a missing row. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = TRUE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes", "prepLease"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
