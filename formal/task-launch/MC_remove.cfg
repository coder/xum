\* U2: a removal marked or finished while the launch forks. Shipped: the U1 recheck, and the cleanup deletes for a missing row (the missing-row half: the model's fixMissingOnly). Open: a row a removal only marked keeps the checkout the fork recreated (deleting under another process's marker is unsafe until the removal and the launch exclude each other, #5531). Expect RemovedRowLeavesNoCheckout violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = TRUE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes"}
  Mutant = "fixMissingOnly"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
