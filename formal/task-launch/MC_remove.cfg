\* U2: a removal marked or finished while the launch forks: the fork recreates the checkout and the cleanup keeps it (a row still present, or a missing row counted as superseded); an init started after the mark is never aborted. Expect RemovedRowLeavesNoCheckout and NoInitAfterCancel violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = TRUE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
