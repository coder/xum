\* U2: a removal marked or finished while the launch forks: the fork recreates the checkout and the cleanup keeps it (a row still present, or a missing row counted as superseded); the shipped U1 recheck keeps the init from starting after the mark. Expect RemovedRowLeavesNoCheckout violated.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = TRUE
  AllowReact = FALSE
  SecondBackend = FALSE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
