\* Two backends plus a cancel of the superseded launch: its cleanup keeps the successor's checkout (CleanupNeverTouchesSuccessor holds). Expect OneMaterializer and PromptSentOnce violated (U3).
SPECIFICATION Spec
CONSTANTS
  AllowCancel = TRUE
  AllowStop = FALSE
  AllowRemove = FALSE
  AllowReact = FALSE
  SecondBackend = TRUE
  MaxRestarts = 0
  ForkCanFail = FALSE
  Fixes = {"initRecheck"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
