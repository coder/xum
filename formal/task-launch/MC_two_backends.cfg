\* U3 (shipped code): a second backend starts up while the launch prepares. The launch lease is published before the row becomes `starting`, so its startup recovery (which reads the rows, then scans the leases) skips the row. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  AllowCancel = FALSE
  AllowStop = FALSE
  AllowRemove = FALSE
  AllowReact = FALSE
  SecondBackend = TRUE
  MaxRestarts = 0
  ForkCanFail = TRUE
  Fixes = {"initRecheck", "missingRowDeletes", "prepLease"}
  Mutant = "none"
INVARIANTS TypeOK NoInitAfterCancel RemovedRowLeavesNoCheckout CleanupNeverTouchesSuccessor PromptRetainedUntilAccepted PromptSentOnce RunningOnlyFromOwnedStarting OneMaterializer
