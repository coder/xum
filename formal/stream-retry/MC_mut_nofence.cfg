\* Mutant: the retry ignores both of its cancel fences (generation and abort signal). NoStreamAfterStop must catch it.
SPECIFICATION Spec
CONSTANTS
  MaxErrors = 2
  HasManualSend = FALSE
  CanCrash = FALSE
  MaxStops = 2
  ManualFenced = FALSE
  NoRetryFence = TRUE
  NoOptOut = FALSE
  NoIdleGuard = FALSE
INVARIANTS TypeOK NoStreamAfterStop NoStaleRetry OneStream StopSettles
