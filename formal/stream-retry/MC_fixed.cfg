\* Fix (R1, agentSession manualSendsInPreflight): a manual send blocks automatic admission from its entry; the fenced retry defers. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  MaxErrors = 2
  HasManualSend = TRUE
  CanCrash = TRUE
  MaxStops = 2
  ManualFenced = TRUE
  NoRetryFence = FALSE
  NoOptOut = FALSE
  NoIdleGuard = FALSE
  AtomicReenable = TRUE
  NoStopEnd = FALSE
INVARIANTS TypeOK NoStreamAfterStop NoStaleRetry OneStream StopSettles NoStrandedSend
