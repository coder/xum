\* Fix probe (R1): a manual send blocks automatic admission from its entry. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  MaxErrors = 2
  HasManualSend = TRUE
  CanCrash = TRUE
  MaxStops = 2
  ManualFenced = TRUE
  NoRetryFence = FALSE
  NoOptOut = FALSE
  NoIdleGuard = FALSE
INVARIANTS TypeOK NoStreamAfterStop NoStaleRetry OneStream StopSettles
