\* No manual send: Stop vs retry, natural end and crash. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  MaxErrors = 3
  HasManualSend = FALSE
  CanCrash = TRUE
  MaxStops = 2
  ManualFenced = FALSE
  NoRetryFence = FALSE
  NoOptOut = FALSE
  NoIdleGuard = FALSE
  AtomicReenable = TRUE
  NoStopEnd = FALSE
INVARIANTS TypeOK NoStreamAfterStop NoStaleRetry OneStream StopSettles NoStrandedSend
