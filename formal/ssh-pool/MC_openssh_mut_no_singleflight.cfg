\* Mutant on the fixed model: no probe singleflight -> two probes for one key.
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Readers = {d1}
  Shard = {s1, s2}
  TTL = 2
  Budgets = {0, 1, 3}
  RetryBudget = 1
  FixUserExit255 = TRUE
  MutNoSingleflight = TRUE
  MutTimeoutAsMissing = FALSE
  MutInflightNotCleared = FALSE
INVARIANTS TypeOK OneProbePerKey ClassificationSafe NoFalseBackoff NoFalsePermanent
PROPERTIES Recovers
