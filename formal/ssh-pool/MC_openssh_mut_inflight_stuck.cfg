\* Mutant on the fixed model: a failed probe stays in the in-flight map -> callers spin, the host never recovers.
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Readers = {d1}
  Shard = {s1, s2}
  TTL = 2
  Budgets = {0, 1, 3}
  RetryBudget = 1
  FixUserExit255 = TRUE
  MutNoSingleflight = FALSE
  MutTimeoutAsMissing = FALSE
  MutInflightNotCleared = TRUE
INVARIANTS TypeOK OneProbePerKey ClassificationSafe NoFalseBackoff NoFalsePermanent
PROPERTIES Recovers
