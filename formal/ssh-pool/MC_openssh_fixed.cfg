\* F3 fix: an exec's exit 255 forces a re-probe instead of a backoff; every property holds.
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Readers = {d1}
  Shard = {s1, s2}
  TTL = 2
  Budgets = {0, 1, 3}
  RetryBudget = 1
  FixUserExit255 = TRUE
  MutNoSingleflight = FALSE
  MutTimeoutAsMissing = FALSE
  MutInflightNotCleared = FALSE
INVARIANTS TypeOK OneProbePerKey ClassificationSafe NoFalseBackoff NoFalsePermanent
PROPERTIES Recovers
