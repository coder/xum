\* Turns + one-off commands on two backends, remove/archive policy (own turn and exec ignored).
SPECIFICATION Spec
CONSTANTS
  Backends = {"A", "B"}
  Kinds = {"turn", "exec"}
  MutIgnore = {"turn", "exec"}
  MaxGen = 1
  CanCrash = FALSE
  MaxRuns = 1
  ConfirmFirst = FALSE
  NoProbe = FALSE
  NoScan = FALSE
  ScanFirst = FALSE
INVARIANTS TypeOK GateExclusion NoTouchDuringMutation OneMutator
