\* Mutant: the mutator scans before publishing its gate (Dekker order broken).
SPECIFICATION Spec
CONSTANTS
  Backends = {"A", "B"}
  Kinds = {"exec"}
  MutIgnore = {"exec"}
  MaxGen = 1
  CanCrash = FALSE
  MaxRuns = 2
  ConfirmFirst = FALSE
  NoProbe = FALSE
  NoScan = FALSE
  ScanFirst = TRUE
INVARIANTS TypeOK GateExclusion NoTouchDuringMutation OneMutator
