\* One-off commands (awaited exec lease) on two backends with crash/restart. Expect all to hold.
SPECIFICATION Spec
CONSTANTS
  Backends = {"A", "B"}
  Kinds = {"exec"}
  MutIgnore = {"exec"}
  MaxGen = 2
  CanCrash = TRUE
  MaxRuns = 2
  ConfirmFirst = FALSE
  NoProbe = FALSE
  NoScan = FALSE
  ScanFirst = FALSE
INVARIANTS TypeOK GateExclusion NoTouchDuringMutation OneMutator
