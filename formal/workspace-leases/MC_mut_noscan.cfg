\* Mutant: the mutator skips its lease scan. Expect GateExclusion violated.
SPECIFICATION Spec
CONSTANTS
  Backends = {"A", "B"}
  Kinds = {"exec"}
  MutIgnore = {"exec"}
  MaxGen = 1
  CanCrash = FALSE
  MaxRuns = 2
  ConfirmFirst = FALSE
  NoProbe = FALSE
  NoScan = TRUE
  ScanFirst = FALSE
INVARIANTS TypeOK GateExclusion NoTouchDuringMutation OneMutator
