\* registered fork without its plan, with no crash.
SPECIFICATION Spec
CONSTANTS
  Scenario = "fork_race"
  Alias = FALSE
  Crashes = TRUE
  Fixes = {"forkCopyAfterRegister"}
  Mutant = "forkSkipCopy"
INVARIANTS TypeOK UniqueOwner NoForeignClobber NoBlockedRead ForkHasPlan
