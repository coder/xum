\* Mutant: fork registration without refuseTakenName. Expect UniqueOwner violated (the no-clobber
\* copy still keeps the first fork's plan, so NoForeignClobber holds).
SPECIFICATION Spec
CONSTANTS
  Scenario = "fork_race"
  Alias = FALSE
  Crashes = TRUE
  Fixes = {"forkCopyAfterRegister"}
  Mutant = "forkNoRefuse"
INVARIANTS TypeOK UniqueOwner NoForeignClobber NoBlockedRead
