\* Rename onto a name a concurrent create takes: neither write re-checks, and mv overwrites. Expect UniqueOwner and NoForeignClobber violated.
SPECIFICATION Spec
CONSTANTS
  Scenario = "rename_race"
  Alias = FALSE
  Crashes = TRUE
  Fixes = {}
  Mutant = "none"
INVARIANTS TypeOK UniqueOwner NoForeignClobber NoBlockedRead
