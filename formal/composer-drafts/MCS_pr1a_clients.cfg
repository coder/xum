\* MCS_pr1a with a client that re-sends its own ids through either of two backends, which makes a
\* batch that is only partly on rows reachable. Without restarts or post-append Errs (the
\* renderer's D5/D2 sources), content survives too: a refused partial batch stays held.
SPECIFICATION Spec
CONSTANTS
  Items = {"i1"}
  AttachOnly = {}
  TwoBackends = TRUE
  TwoWindows = FALSE
  WithQueue = TRUE
  WithRollback = FALSE
  WithRestart = FALSE
  WithOtherWriter = FALSE
  WithDowngrade = FALSE
  FixIds = TRUE
  FixRenderer = FALSE
  NarrowBackend = TRUE
  ClientIds = TRUE
  MutRollbackAfterAppend = FALSE
  MutNoRefusalMemory = TRUE
  MutDeadIsAccepted = FALSE
  MutNoDedupe = FALSE
  MutBookOnly = FALSE
  MutEmptyRule = FALSE
  MutConflictAccept = FALSE
  DowngradeSettledOnly = FALSE
INVARIANTS TypeOK NoSilentLoss NoDup NoResurrection
