\* PR1a as shipped, for H1: backend rules on (ids, the in-lock check, no rollback after append),
\* narrowed: no refusal memory (no lookups) and no held/in-flight skip at enqueue. Renderer rules
\* off (replies restore input, a post-append Err is still reported). MCS_pr1a_clients adds a
\* client that re-sends its own ids through two backends.
SPECIFICATION Spec
CONSTANTS
  Items = {"i1"}
  AttachOnly = {}
  TwoBackends = FALSE
  TwoWindows = FALSE
  WithQueue = TRUE
  WithRollback = TRUE
  WithRestart = TRUE
  WithOtherWriter = FALSE
  WithDowngrade = FALSE
  FixIds = TRUE
  FixRenderer = FALSE
  NarrowBackend = TRUE
  ClientIds = FALSE
  MutRollbackAfterAppend = FALSE
  MutNoRefusalMemory = TRUE
  MutDeadIsAccepted = FALSE
  MutNoDedupe = FALSE
  MutBookOnly = FALSE
  MutEmptyRule = FALSE
  MutConflictAccept = FALSE
  DowngradeSettledOnly = FALSE
INVARIANTS TypeOK NoSilentLoss NoDup NoResurrection
