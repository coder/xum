\* PR2 as shipped: the renderer half (pendingSends, lookups, retries) on the PR1a backend
\* (NarrowBackend: no held/in-flight skip at enqueue, a partial batch is refused whole and held,
\* the held list shows every entry, a queued held Retry drops its entry). The renderer re-sends
\* only after an "unknown" answer (Retry guard) and mints a fresh id per send (no ConflictSend).
\* Queue batches, dequeue refusal and held Retry, an attachment-only input, two windows,
\* restarts. One backend: a second backend on the same workspace is not modeled here (its
\* "unknown" answer can let a re-send race a live copy).
SPECIFICATION Spec
CONSTANTS
  Items = {"i1", "a1"}
  AttachOnly = {"a1"}
  TwoBackends = FALSE
  TwoWindows = TRUE
  WithQueue = TRUE
  WithRollback = FALSE
  WithRestart = TRUE
  WithOtherWriter = FALSE
  WithDowngrade = FALSE
  FixIds = TRUE
  FixRenderer = TRUE
  NarrowBackend = TRUE
  ClientIds = FALSE
  MutRollbackAfterAppend = FALSE
  MutNoRefusalMemory = FALSE
  MutDeadIsAccepted = FALSE
  MutNoDedupe = FALSE
  MutBookOnly = FALSE
  MutEmptyRule = FALSE
  MutConflictAccept = FALSE
  DowngradeSettledOnly = FALSE
INVARIANTS TypeOK NoSilentLoss NoDup NoResurrection
