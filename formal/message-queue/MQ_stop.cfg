\* Faithful model with one Stop cascade; expected: no violation (user input is never discarded, nothing admitted before the Stop runs after it).
SPECIFICATION Spec
CONSTANTS
  N = 3
  AllowHold = TRUE
  MaxDecisions = 1
  AllowWithdraw = FALSE
  AllowRemove = FALSE
  AllowReorder = FALSE
  AllowStop = TRUE
  Mutant = "none"
INVARIANTS NoLossNoDup UserInputNeverLost NoRunAfterStop UserOrder NoStrandedQueue
