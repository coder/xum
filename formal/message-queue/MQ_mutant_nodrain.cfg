\* Mutation sanity: resolving the report decision does not re-run the idle drain; expected: NoStrandedQueue violated.
SPECIFICATION Spec
CONSTANTS
  N = 3
  AllowHold = TRUE
  MaxDecisions = 2
  AllowWithdraw = FALSE
  AllowRemove = FALSE
  AllowReorder = FALSE
  AllowStop = FALSE
  Mutant = "decisionNoDrain"
INVARIANTS NoStrandedQueue
