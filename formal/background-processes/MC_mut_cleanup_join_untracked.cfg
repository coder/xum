  HasMigration = TRUE
  Mutator = "remove"
  SpawnSealed = FALSE
  ArchiveCleans = FALSE
  NoDrain = FALSE
  JoinTimeout = TRUE
  JoinUntracked = TRUE
  ExecTimeout = FALSE
  MigrationFails = FALSE
INVARIANTS TypeOK NoLiveAfterDelete FgBgExclusive MigrationOwned
