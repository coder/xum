\* The shipped B1 fix: exit_code checked before SIGTERM, a synchronous once-latch, and an
\* escalation that answers to `kill -0` alone. A PGID reused during `sleep 2` stays reachable.
SPECIFICATION Spec
CONSTANTS
  Callers = {"stop", "timer"}
  CheckMarker = TRUE
  CheckEscalation = FALSE
  OnceGuard = TRUE
INVARIANTS TypeOK NoSignalToReusedPgid NaturalExitPreserved OneKillSequence
