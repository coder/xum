\* What ships for B1 (#5481 stays open): a synchronous once-latch and a kill command that never
\* overwrites exit_code, but no exit check before the signal, so a stop after an unobserved
\* natural exit still signals a PGID that may have been reused.
SPECIFICATION Spec
CONSTANTS
  Callers = {"stop", "timer"}
  CheckMarker = FALSE
  OnceGuard = TRUE
  Noclobber = TRUE
INVARIANTS TypeOK NoSignalToReusedPgid NaturalExitPreserved OneKillSequence
